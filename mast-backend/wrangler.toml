name = "mast-booking-backend"
main = "src/worker.js"
compatibility_date = "2026-01-15"

# Non-secret configuration. Secrets go in via `wrangler secret put` — never here.
[vars]
# Comma-separated origin allowlist. Also used to validate Stripe return URLs.
#
# The MAST page is served from the Atlas Glinn site today (mastsolutions.com is a
# GoDaddy forward, not a web server), so atlasglinn.com MUST be listed or CORS
# blocks checkout on the page's actual origin. mastsolutions.com entries are here
# for when it gets real hosting; www.mastsolutions.com has no DNS record yet.
# The FIRST entry is the fallback used for Stripe return URLs.
ALLOWED_ORIGINS = "https://www.atlasglinn.com,https://atlasglinn.com,https://mastsolutions.com"
SITE_URL = "https://www.atlasglinn.com/mastsolutions.html"
NOTIFY_FROM = "MAST Solutions <bookings@mastsolutions.com>"

# ── Document distribution (owner-specified 2026-09-01) ──────────────
# Two explicit lists rather than one list with exclusions — an exclusion rule
# breaks the first time someone is added in the wrong place.
#
# The signed range agreement goes to all four. Everything else omits Alex.
DOC_RECIPIENTS_AGREEMENT = "alexalbert308@gmail.com,atlasglinn.hq@atlasglinn.com,Matthew@mastsolutions.com,a.glover@atlasglinn.com"
DOC_RECIPIENTS_INTERNAL  = "atlasglinn.hq@atlasglinn.com,Matthew@mastsolutions.com,a.glover@atlasglinn.com"
#
# Address confirmed by owner 2026-09-01: atlasglinn.hq@ (an earlier draft
# had a stray "w").
# ⚠️ Eligibility answers are NOT in either list, deliberately. They are
#    criminal-history data; staff read them in the admin under access control.
#    See ARCHITECTURE.md §6a.

# The range address is NOT public. It ships only in post-registration email.
RANGE_ADDRESS = "4159 County Road 161, Wharton, TX 77488"
RANGE_COORDS  = "29.339959, -96.046542"

# Order storage. Create with:
#   wrangler d1 create mast_bookings
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "mast_bookings"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# ── Secrets (set with `wrangler secret put <NAME>`) ─────────────────
#   STRIPE_SECRET_KEY       sk_live_... (or sk_test_... while testing)
#   STRIPE_WEBHOOK_SECRET   whsec_...   from the Stripe webhook endpoint
#   RESEND_API_KEY          re_...      for booking notification emails
#   NOTIFY_EMAIL            where booking alerts are sent (comma-separated ok)
#   ADMIN_KEY               long random string guarding GET /roster
#
# Optional per-plan fallback when a membership is not in the D1 table:
#   STRIPE_PRICE_<PLAN_KEY> e.g. STRIPE_PRICE_RANGE_MEMBER = price_1Abc...
