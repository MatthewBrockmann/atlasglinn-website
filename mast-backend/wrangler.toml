name = "mast-booking-backend"
# Account ID (not a secret): lets wrangler skip the user-level /memberships lookup, which an Account-owned API token
# cannot make (deploy-worker run #31, 2026-09-08: "Authentication failed (9106)" on /memberships with the token present).
account_id = "2216d0c2d1376a83092838b966441547"
main = "src/worker.js"
compatibility_date = "2026-01-15"

# The blank Class Participation Agreement is bundled as bytes and filled per registration.
[[rules]]
type = "Data"
globs = ["**/*.pdf"]
fallthrough = true

# ONE TRIGGER, AND IT DRIVES BOTH JOBS — because a second one cannot be registered on this account.
# Deploy MAST Worker run #38 (main e8c12da, 2026-09-09) uploaded the script and then had its SCHEDULES refused:
# "This account has reached the Workers Free limit of 5 cron triggers per account" (Cloudflare code 10072). wrangler had
# ALREADY put the code live, so the Worker ran run #38's code on the PREVIOUS trigger set — the daily "17 9 * * *" alone,
# with the */5 tax tick never registered. Half a deploy, and nothing in the run said which half.
# THE PAID PLAN IS THE WAY BACK: Workers Paid allows 1,000 cron triggers per account, and on it the daily trigger goes
# straight back into the list below — scheduled() still branches on "17 9 * * *" by name, and both paths take the same
# once-a-day claim (daily:last_run in D1), so the pair is a second FIRE, never a second RUN of the daily work.
#
#   */5 * * * *   Stripe Tax on all 288 fires: re-measure the account when the cached measurement is due, and run the
#                 idempotent self-setup when it is genuinely not collecting.
#                 AND, on the ONE fire whose scheduled minute falls in 09:15–09:19 UTC, the daily work as well: purge
#                 eligibility answers past their purge_after (RETENTION-POLICY.md), mark registrations that never
#                 reached payment as abandoned, the T−7 / T−1 / T+1 journeys, and the Monday CRM digest (scheduled()
#                 checks the weekday). The window is that wide for the slack a late delivery needs, and because 09:17 —
#                 the daily trigger's own minute — sits inside it. Running it twice is prevented by the D1 claim, not by
#                 the window: DAILY_GUARD_KEY holds the UTC date and the claim is one conditional upsert.
#
# ADD A TRIGGER HERE AND YOU MUST ADD ITS STRING TO scheduled() (src/worker.js) — and you must have the plan for it.
# Anything that is neither known string (a trigger added here, a renamed schedule, an event with no cron) logs
# { unknown_cron } and runs the TICK, which is one D1 read on a ready account. It used to fall through to the daily
# branch, so the fail direction was 288 retention purges, journey passes and digest attempts a day.
#
# WHY FIVE MINUTES, AND WHY THIS IS THE TRIGGER THAT SURVIVED. The readiness a checkout reads is trusted for ten minutes
# (TAX_READY_TTL_MS). Refreshed once a day it was stale 1430 minutes out of 1440, so an order arriving on a quiet
# afternoon found no fresh measurement and sold UNTAXED — measured in review: 20 isolated orders, 0 taxed. A completed
# Checkout Session cannot be re-taxed afterwards and the permit holder owes Texas the difference out of margin. Cost of
# the tick on a ready account: one D1 read, and two Stripe GETs whenever the measurement is due — roughly 288 reads a
# day, no writes. The daily work can ride a five-minute trigger; the tax loop cannot ride a daily one.
# The second half of that fix is in the Worker: a measurement that said READY is still trusted for 24 hours
# (TAX_READY_GRACE_MS) even once it is stale, so this trigger going quiet costs a day of grace, not the next ten minutes
# of orders. After 24 hours of silence tax turns itself off — fail closed — and the next checkout re-triggers the loop.
# AND A FAILED MEASUREMENT DOES NOT SPEND THAT GRACE. Only a measured "no" from Stripe, or 24 hours of silence, turns
# tax off; a 5xx, a timeout or an unreachable network leaves the ready row alone and is recorded in tax:last_run. Round
# 4 wrote UNMEASURED over the ready row on any failure, and the grace only applies to a row that says READY, so this
# tick destroyed the grace on its first bad tick: an hour of Stripe 500s sold 10 of 12 orders untaxed, measured.
[triggers]
crons = ["*/5 * * * *"]

# Non-secret configuration. Secrets go in via `wrangler secret put` — never here.
[vars]
# Comma-separated origin allowlist. Also used to validate Stripe return URLs.
#
# The MAST page is served from the Atlas Glinn site today (mastsolutions.com is a
# GoDaddy forward, not a web server), so atlasglinn.com MUST be listed or CORS
# blocks checkout on the page's actual origin. mastsolutions.com entries are here
# for when it gets real hosting; www.mastsolutions.com has no DNS record yet.
# The FIRST entry is the origin the Worker falls back to; SITE_URL below is the page Stripe
# returns people to when the page did not say. Both are the apex host: that is where the page
# is served (atlasglinn.com/mastsolutions.html, live 2026-09-05) and where the owner tested.
# htmlpreview.github.io was listed while the owner reviewed branch previews there;
# removed 2026-09-04 before launch (previews now render from raw.githack.com, which
# is deliberately NOT allowed: forms on a preview must not reach the live Worker).
ALLOWED_ORIGINS = "https://atlasglinn.com,https://www.atlasglinn.com,https://mastsolutions.com,https://www.mastsolutions.com"
SITE_URL = "https://www.mastsolutions.com/"
NOTIFY_FROM = "MAST Solutions <bookings@mastsolutions.com>"
# NOTIFY_FROM is a sender label on the Resend-verified domain, not a mailbox (owner, 2026-09-05: "bookings@mastsolutions.com
# = NOT email"). Replies to any email the Worker sends go to REPLY_TO, a real, read mailbox; office alerts still reply to
# the customer who wrote in.
REPLY_TO = "matthew@mastsolutions.com"
# CRM journeys (T−7 / T−1 / T+1 emails to booked participants, src/crm.js). Switched on 2026-09-06: Brockmann pasted all
# three texts back with his edits the same day ("show me them before" → done), so the daily cron sends them.
JOURNEYS_ENABLED = "1"
# Stripe Tax. "1" = every Checkout Session asks Stripe to compute sales tax and the tax code rides on the line item;
# anything else and the bodies sent to Stripe are byte-identical to the pre-tax ones. On for Houston, Texas because the
# owner said so on 2026-09-08 ("Also, a stripe taken out sales tax for Houston, Texas") and confirmed on 2026-09-09 that
# the business holds a Texas Sales and Use Tax Permit. Tax is EXCLUSIVE: added on top of the listed price.
# TO TURN IT OFF: set this to "0" and redeploy (push to main, or run the Deploy MAST Worker workflow). Nothing else needs
# undoing — the account keeps its Stripe Tax registration, the Worker just stops asking.
# ORDER DOES NOT MATTER, and this comment used to claim it did. A Session with automatic_tax fails outright when Stripe
# Tax is not active on the ACCOUNT — that part is true — but a checkout only asks for tax when a MEASUREMENT of the
# account, cached in D1, says it is collecting (taxReadyCached, src/worker.js). Stripe is never called on the customer's
# path: an account that is not collecting, or has not been measured recently, gets the byte-identical pre-tax body. The
# measurement and the idempotent setup run OFF that path — the */5 tick above, the daily cron, and a refresh a checkout
# enqueues behind its own response, none of which does anything unless it can take the one-per-minute lock. A
# measurement that said READY is trusted for 24 hours even once it is stale, so orders keep being taxed while the loop
# is quiet, and if that trust is ever wrong Stripe says so when the Session is created and the Worker retries once
# without the tax fields (tax_fallback in the logs) — the checkout completes either way. That retry does NOT write the
# readiness row: it enqueues a real measurement behind the response, under the tax:lock, because the row it used to
# write was reachable by an anonymous request on any Stripe free text matching /automatic_tax|tax|registration/ and so
# turned tax off for every other buyer. So this switch is safe to ship
# on a Stripe account that has never been set up, and deploy-worker.yml's tax step is a REPORT of what happened, not the
# thing that makes it safe. The earlier wording — "deploy-worker.yml runs it after every deploy and fails the job if the
# account is not active, so a tax-enabled deploy cannot reach the page without it" — was wrong on its own terms: with no
# ADMIN_KEY repository secret that step printed a warning and exited 0.
STRIPE_TAX = "1"
# The Google review link in the T+1 email and on both sites (same value as GOOGLE_REVIEW_URL in scripts/cinematic_shell.py).
# 2026-09-07, Brockmann from his phone: "The google review is wrong" - the search-dialog link built from the id in his
# Business Profile paste was replaced by the Maps Search URL by name and address: it always lands on the listing, where
# "Write a review" is one tap. Swap in the g.page/r/.../review short link from his Business Profile when he provides it.
REVIEW_URL = "https://www.google.com/maps/search/?api=1&query=Atlas+Glinn%2C+2450+Fondren+Rd+Suite+255%2C+Houston%2C+TX+77063"
# Who gets the Monday CRM digest, comma-separated. Brockmann, 2026-09-08, on the contact notification email:
# "REMOVE 'Page: github-actions'. Add to CRM backend + weekly CRM Emails to matthew@atlasglinn.com +
# Matthew@mastsolutions.com." Not a secret — two of his own addresses; unset = the digest is logged and skipped.
CRM_DIGEST_TO = "matthew@atlasglinn.com,matthew@mastsolutions.com"
# The sealed range-directions PDF (src/sealed.js): fetched from main and decrypted with the key in D1. Unset = the default
# raw URL of mast-backend/assets/range-directions.sealed.json on main; "off" disables it.
# DIRECTIONS_SEALED_URL = "https://raw.githubusercontent.com/MatthewBrockmann/atlasglinn-website/main/mast-backend/assets/range-directions.sealed.json"



# Order storage. Database created 2026-09-03 in the Atlas Glinn Cloudflare
# account (region ENAM) and schema.sql applied to it.
[[d1_databases]]
binding = "DB"
database_name = "mast_bookings"
database_id = "a510159f-a4f6-44fd-87d1-63db5ce27773"

# ── Secrets (set with `wrangler secret put <NAME>`) ─────────────────
#   STRIPE_SECRET_KEY       sk_live_... (or sk_test_... while testing)
#   STRIPE_WEBHOOK_SECRET   whsec_...   from the Stripe webhook endpoint
#   RESEND_API_KEY          re_...      for booking notification, confirmation and agreement emails
#   NOTIFY_EMAIL            where booking alerts and eligibility-review notices are sent (comma-separated ok)
#   ADMIN_KEY               long random string guarding GET /roster
#   ACCOUNT_SECRET          long random string signing student sign-in tokens (/account/*); rotate = everyone signed out
#
# Private routing and location — SECRETS, never in this file (the repo is public):
#   RANGE_ADDRESS           street address of the range; emailed only after booking
#   RANGE_COORDS            "lat, lon" for the directions email
#   RANGE_DIRECTIONS        the driving directions as Markdown; src/directions.js renders address + coords + text into
#                           MAST-Range-Directions.pdf, attached to the confirmation and the T−7 / T−1 emails
#   DOC_RECIPIENTS_AGREEMENT comma-separated; everyone who receives the signed range
#                           agreement (owner list of four, 2026-09-01)
#   DOC_RECIPIENTS_INTERNAL  comma-separated; MAST staff who receive everything else
#                           (same list minus the range host)
#
# Optional per-plan fallback when a membership is not in the D1 table:
#   STRIPE_PRICE_<PLAN_KEY> e.g. STRIPE_PRICE_RANGE_MEMBER = price_1Abc...
