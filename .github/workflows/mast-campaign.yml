# MAST News campaigns from a GitHub runner, so the owner can test and send from his phone: the Mailchimp key lives only on
# the Worker (and his Mac Keychain), and the cloud container reaches neither Mailchimp nor the Worker. Each run reads
# reference/mailchimp/<campaign>/campaign.json ({title, subject, preview, from_name, reply_to, ga}) and, for test,
# email.html, and calls the Worker's POST /admin/mailchimp/campaign with a one-time X-Campaign-Key. The campaign is the one
# in the MAST audience whose Mailchimp title is campaign.json's title.
#   test    builds the Mailchimp draft (or refreshes the draft already carrying the title), test-sends it to the Worker's
#           fixed address (CAMPAIGN_TEST_TO, default matthew@atlasglinn.com; never an address from this run) and reports
#           Mailchimp's send checklist and the draft's `revision`: 16 hex of a SHA-256 over what Mailchimp holds (subject,
#           preview, title, from name, reply-to, audience and segment, html). The Worker refuses html off the site brand
#           system (422 off_brand: #080C14, #C9A84C, #1A6BDE, Orbitron, Rajdhani; the owner's 2026-10-01 rule), html
#           without *|UNSUB|*, and a reply-to outside @mastsolutions.com / @atlasglinn.com. Nothing reaches the audience.
#   send    sends THAT draft to the whole audience, and only while Mailchimp still holds the revision the approved test
#           printed: dispatch it with that revision. No content or settings are written. SEND IS THE OWNER'S DECISION. It
#           is dispatched only after he has read the test email and approved it. The Worker requires confirm "SEND" and
#           the revision, and refuses a title already sent (409 already_sent), a title with no draft (404), a draft
#           Mailchimp's checklist does not pass (409 not_ready) and a draft that changed since that test in any way, by a
#           later test run or by hand in Mailchimp (409 revision_mismatch).
#           A SEND CARRIES WHEN (owner 2026-10-02, after MAST News #2 went out at 11:09 PM instead of the next morning: "it
#           wasnt suppost to go out until tomorrow morning"). `when` is required: "now" sends at once; a UTC quarter-hour
#           such as 2026-10-06T14:30Z schedules it in Mailchimp under the same gates, and the campaign is then locked
#           until it goes or is unscheduled. A send with no `when` posts nothing.
#   unschedule  returns a scheduled campaign to its draft (confirm "UNSCHEDULE"); the revision is unchanged by it.
#   status  lists the campaigns carrying the title and, for a sent one, opens and clicks.
# Every field of the answer is a ::notice:: annotation (a cloud session can read annotations but not job logs; at most ten
# per step, so the overflow steps below carry the rest) and a row in the job summary. A non-2xx answer is an ::error::
# annotation and fails the run.
name: MAST News campaign
on:
  workflow_dispatch:
    inputs:
      action:
        description: "test = draft + test email to the fixed address · send = send the approved draft at `when` (owner's decision) · unschedule = cancel a scheduled send · status = read back"
        type: choice
        options: [test, send, unschedule, status]
        default: test
      campaign:
        description: "Folder under reference/mailchimp/ holding campaign.json and email.html (lowercase letters, digits, dashes)"
        type: string
        required: true
      revision:
        description: "send only: the revision the approved test run printed (16 lowercase hex). Ignored by test and status"
        type: string
        required: false
        default: ""
      when:
        description: "send only, REQUIRED: now, or a UTC quarter-hour like 2026-10-06T14:30Z (9:30 AM CT = 14:30Z). Blank = nothing is sent"
        type: string
        required: false
        default: ""
permissions:
  contents: read
# One run per campaign at a time. This is NOT what makes a send safe, and it is not a queue: GitHub keeps one pending run
# per group and cancels the older pending one, and a send waiting behind a test would start after that test has rewritten
# the draft. The revision is the safety: a send carries the revision of the test the owner approved, and the Worker sends
# nothing unless Mailchimp's draft still digests to it, whatever ran in between.
concurrency:
  group: mast-campaign   # workflow-wide: every run writes the one Worker-wide CAMPAIGN_RUN_KEY, so runs never overlap
  cancel-in-progress: false
env:
  WORKER: https://mast-booking-backend.matthew-221.workers.dev
jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repository holds no copy of ADMIN_KEY (it lives only on the Worker), so each run puts its own random key on the
      # Worker as CAMPAIGN_RUN_KEY, sends it as X-Campaign-Key (it opens /admin/mailchimp/campaign and nothing else), and
      # the last step overwrites it with a value nobody holds. Owner 2026-10-01: remote, no Terminal, no secret to paste.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mast-backend/package-lock.json
      - name: Install wrangler (pinned in mast-backend/package-lock.json)
        working-directory: mast-backend
        run: npm ci --no-audit --no-fund
      - name: Put a one-time run key on the Worker
        working-directory: mast-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::no Cloudflare API token secret reached this job, so no run key can be set"; exit 1; }
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "CAMPAIGN_KEY=$key" >> "$GITHUB_ENV"
          printf '%s' "$key" | npx wrangler secret put CAMPAIGN_RUN_KEY
          # The secret takes effect with the version wrangler deploys for it; wait until the route accepts the key.
          # Three accepts in a row, not one: run 36953108820 (2026-10-02) passed a single probe and the real call that
          # followed still got 401. Cloudflare rolls the new version out across the edge, so one accept is one isolate.
          ok=0
          for i in $(seq 1 40); do
            code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST "$WORKER/admin/mailchimp/campaign" \
              -H "Content-Type: application/json" -H "X-Campaign-Key: $key" --data '{"action":"status","title":"run-key-probe"}' || echo 000)
            if [ "$code" != 401 ] && [ "$code" != 000 ]; then ok=$((ok+1)); else ok=0; fi
            if [ "$ok" -ge 3 ]; then echo "run key accepted 3 times in a row after $i check(s) (HTTP $code)"; exit 0; fi
            sleep 3
          done
          echo "::error::the Worker never accepted the run key"; exit 1
      - name: Call the Worker
        env:
          ACTION: ${{ inputs.action }}
          CAMPAIGN: ${{ inputs.campaign }}
          REVISION: ${{ inputs.revision }}
          WHEN: ${{ inputs.when }}
        run: |
          set -euo pipefail
          case "$ACTION" in test|send|unschedule|status) ;; *) echo "::error::action must be test, send, unschedule or status (got '$ACTION')"; exit 1;; esac
          # Checked BEFORE it is used in a path: no slash, no dot, so it can only name a folder directly under reference/mailchimp/.
          if ! [[ "$CAMPAIGN" =~ ^[a-z0-9-]{3,60}$ ]]; then
            echo "::error::campaign must match ^[a-z0-9-]{3,60}\$ (a folder name under reference/mailchimp/)"; exit 1
          fi
          if [ "$ACTION" = send ] && ! [[ "$REVISION" =~ ^[0-9a-f]{16}$ ]]; then
            echo "::error::send needs the revision the approved test run printed (16 lowercase hex); nothing was posted"; exit 1
          fi
          # The time is the owner's decision, so a send never infers it. Shape only here; the Worker checks the rest
          # (quarter-hour in UTC, at least 15 minutes out, within a year) and answers 400 field schedule_time.
          if [ "$ACTION" = send ] && [ "$WHEN" != now ] && ! [[ "$WHEN" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:00)?Z$ ]]; then
            echo "::error::send needs when: 'now', or a UTC quarter-hour like 2026-10-06T14:30Z (got '${WHEN:-blank}'); nothing was posted"; exit 1
          fi
          [ -n "${CAMPAIGN_KEY:-}" ] || { echo "::error::no run key (the step before should have set it)"; exit 1; }
          export DIR="reference/mailchimp/$CAMPAIGN" BODY="$RUNNER_TEMP/body.json" RESP="$RUNNER_TEMP/resp.json" NOTICES="$RUNNER_TEMP/notices.txt"
          : > "$NOTICES"
          python3 - <<'PY'
          import json, os, sys
          d, action = os.environ['DIR'], os.environ['ACTION']
          def die(msg):
              print('::error::' + msg); sys.exit(1)
          try:
              meta = json.load(open(os.path.join(d, 'campaign.json'), encoding='utf-8'))
          except FileNotFoundError:
              die('%s/campaign.json not found' % d)
          except ValueError as e:
              die('%s/campaign.json is not valid JSON: %s' % (d, e))
          title = meta.get('title') if isinstance(meta, dict) else None
          if not isinstance(title, str) or not title.strip():
              die('%s/campaign.json has no title' % d)
          if action == 'send' and os.environ['WHEN'] == 'now':
              body = {'action': 'send', 'title': title, 'confirm': 'SEND', 'revision': os.environ['REVISION']}
          elif action == 'send':
              body = {'action': 'schedule', 'title': title, 'confirm': 'SEND', 'revision': os.environ['REVISION'], 'schedule_time': os.environ['WHEN']}
          elif action == 'unschedule':
              body = {'action': 'unschedule', 'title': title, 'confirm': 'UNSCHEDULE'}
          elif action == 'status':
              body = {'action': 'status', 'title': title}
          else:
              try:
                  html = open(os.path.join(d, 'email.html'), encoding='utf-8').read()
              except FileNotFoundError:
                  die('%s/email.html not found' % d)
              body = {'action': 'test', 'title': title, 'html': html}
              for k in ('subject', 'preview', 'from_name', 'reply_to', 'ga'):
                  if meta.get(k) is not None: body[k] = meta[k]
          json.dump(body, open(os.environ['BODY'], 'w', encoding='utf-8'))
          print('request: %s "%s" (%d bytes)' % (action, title, os.path.getsize(os.environ['BODY'])))
          PY
          # Retry on 401 only. Run 36962922788 (2026-10-02, a send) passed three probe accepts in a row and its real call
          # still got 401 one second later: the edge had not finished rolling out the new key. A 401 is answered before
          # the route runs, so nothing was sent and repeating the call is safe. Any other answer, including a timeout
          # (000), is final: a send that timed out may have gone out, and the Worker's 409 already_sent guards a re-run.
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -m 120 -o "$RESP" -w '%{http_code}' -X POST "$WORKER/admin/mailchimp/campaign" \
              -H "Content-Type: application/json" -H "X-Campaign-Key: $CAMPAIGN_KEY" --data-binary @"$BODY") || code=000
            [ "$code" = 401 ] || break
            echo "attempt $attempt: 401, the run key has not reached this edge yet; retrying in 5 s"
            sleep 5
          done
          export CODE="$code"
          rc=0
          python3 - <<'PY' || rc=$?
          import json, os, re, sys
          code, key = os.environ['CODE'], os.environ.get('CAMPAIGN_KEY') or '\0'
          raw = open(os.environ['RESP'], encoding='utf-8', errors='replace').read() if os.path.exists(os.environ['RESP']) else ''
          raw = raw.replace(key, '[redacted]')
          msg = lambda v: str(v).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          prop = lambda v: msg(v).replace(':', '%3A').replace(',', '%2C')
          val = lambda v: v if isinstance(v, str) else json.dumps(v, ensure_ascii=False)
          fields = []
          try:
              data = json.loads(raw)
          except ValueError:
              data = None
          if isinstance(data, dict):
              for k, v in data.items():
                  if k == 'checklist' and isinstance(v, dict):
                      fields.append(('checklist.is_ready', v.get('is_ready')))
                      for i, p in enumerate(v.get('problems') or []):
                          # public repo: Mailchimp's checklist text carries audience counts; keep them off the annotations
                          if isinstance(p, dict) and isinstance(p.get('details'), str):
                              p = dict(p, details=re.sub(r'\d[\d,]*(?=\s*(?:recipients|email addresses|contacts|subscribers))', 'N', p['details']))
                          fields.append(('checklist.problems[%d]' % i, p))
                  elif k in ('audience_members', 'emails_sent'):
                      continue  # public repo: run annotations are world-readable, the list size stays private
                  elif k in ('problems', 'campaigns') and isinstance(v, list):
                      if not v: fields.append((k, []))
                      for i, p in enumerate(v):
                          if isinstance(p, dict) and 'emails_sent' in p:
                              p = dict(p, emails_sent='withheld')   # public repo: annotations AND the job summary are world-readable
                          fields.append(('%s[%d]' % (k, i), p))
                  else:
                      fields.append((k, v))
          else:
              fields.append(('body', raw[:300] or '(empty)'))
          fields.insert(0, ('http_status', code))
          with open(os.environ['NOTICES'], 'w', encoding='utf-8') as f:
              for k, v in fields: f.write('::notice title=%s::%s\n' % (prop(k), msg(val(v))))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as s:
              s.write('### MAST News campaign: %s `%s`\n\n| field | value |\n|---|---|\n' % (os.environ['ACTION'], os.environ['CAMPAIGN']))
              for k, v in fields: s.write('| `%s` | %s |\n' % (k, val(v).replace('|', '\\|').replace('\n', ' ')))
          if not code.startswith('2'):
              err = data.get('error') if isinstance(data, dict) else None
              detail = (data.get('detail') or data.get('missing') or data.get('problems') or '') if isinstance(data, dict) else raw[:300]
              print('::error title=HTTP %s::%s' % (prop(code), msg(('%s %s' % (err or 'no JSON answer', val(detail))).strip())))
              sys.exit(1)
          PY
          head -n 10 "$NOTICES"
          [ "$(wc -l < "$NOTICES")" -le 10 ] || echo "($(( $(wc -l < "$NOTICES") - 10 )) more fields in the next steps)"
          exit "$rc"
      - name: Fields 11-20
        if: always()
        run: sed -n '11,20p' "$RUNNER_TEMP/notices.txt" 2>/dev/null || true
      - name: Fields 21-30
        if: always()
        run: sed -n '21,30p' "$RUNNER_TEMP/notices.txt" 2>/dev/null || true
      - name: Fields 31-40
        if: always()
        run: |
          sed -n '31,40p' "$RUNNER_TEMP/notices.txt" 2>/dev/null || true
          n=$(wc -l 2>/dev/null < "$RUNNER_TEMP/notices.txt" || echo 0)
          [ "$n" -le 40 ] || echo "::notice title=truncated::$(( n - 40 )) more fields; the job summary lists every one"
      - name: Retire the run key
        if: always()
        working-directory: mast-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || exit 0
          openssl rand -hex 32 | tr -d '\n' | npx wrangler secret put CAMPAIGN_RUN_KEY > /dev/null && echo "run key replaced with a value nobody holds"
