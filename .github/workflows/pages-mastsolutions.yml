# mastsolutions.com served from GitHub Pages — no host login, no secret, nothing on the Mac (2026-09-07).
#
# Brockmann: "when I use www.mastsolutions.com it should be that url not - atlasglinn/". The cPanel route
# (deploy-mastsolutions.yml) waits on three secrets nobody reachable holds; this one needs none: the runner's own token
# creates or switches the repository's Pages site to "GitHub Actions" builds, deploys dist/mastsolutions/index.html with
# the page's asset tree and its build-manifest.json, checks the deployment answers with the MAST page, then sets the
# custom domain. Live since 2026-09-08 04:16 UTC on the www host: GoDaddy's Forwarding owns the apex A rows
# (15.197.225.128 / 3.33.251.168, not editable) and forwards mastsolutions.com → https://www.mastsolutions.com (301);
# `CNAME www → matthewbrockmann.github.io` is the row GitHub serves; the custom domain in Settings → Pages is
# www.mastsolutions.com (GitHub wrote it into the root CNAME file itself). The workflow token cannot change the custom
# domain (403), so the PUT below is a no-op that only warns.
name: Publish mastsolutions.com (GitHub Pages)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dist/mastsolutions/**'
      - '.github/workflows/pages-mastsolutions.yml'
      # the Atlas Glinn pages under /preview/atlasglinn/ and what they serve
      - '*.html'
      - 'images/**'
      - 'vendor/**'
      - 'scripts/assemble-atlas.py'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-mastsolutions
  cancel-in-progress: false
env:
  DOMAIN: www.mastsolutions.com
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site (index.html, manifest, the page's assets)
        run: |
          set -e
          test -f dist/mastsolutions/index.html || { echo "::error::dist/mastsolutions/index.html missing — run python3 scripts/assemble-cinematic.py and commit"; exit 1; }
          mkdir -p stage
          cp dist/mastsolutions/index.html stage/index.html
          cp dist/mastsolutions/build-manifest.json stage/build-manifest.json
          # robots.txt + sitemap.xml are this domain's own (the root ones are atlasglinn.com's); written by assemble-cinematic.py
          for f in robots.txt sitemap.xml; do test -f "dist/mastsolutions/$f" || { echo "::error::dist/mastsolutions/$f missing — run python3 scripts/assemble-cinematic.py and commit"; exit 1; }; cp "dist/mastsolutions/$f" "stage/$f"; done
          printf '%s\n' "$DOMAIN" > stage/CNAME
          touch stage/.nojekyll
          # The asset resolver, written once and used by both stages (this one and the Atlas preview below): it reads the
          # pages given to it, follows their local src/href/poster/url()/import references (and one level into the css and
          # js it finds), refuses an LFS pointer, and copies each file under the output root at the same relative path.
          # A page's references resolve against the repo root, which is where its staged copy's own folder starts.
          RESOLVER="${RUNNER_TEMP:-/tmp}/resolve-assets.py"
          cat > "$RESOLVER" <<'PY'
          import os, re, shutil, sys
          out, pages = sys.argv[1], sys.argv[2:]; seen = []
          attr = re.compile(r'''(?:src|href|poster)=["']([^"'#?]+)|url\(['"]?([^)'"?#]+)|from\s+['"]\.?/?([^'"]+\.js)['"]|['"]((?:images|vendor)/[^'"?#\s]+)['"]''')
          queue = []
          for page in pages:
              for m in attr.finditer(open(page, encoding='utf-8', errors='ignore').read()):
                  u = (m.group(1) or m.group(2) or m.group(3) or m.group(4) or '').strip()
                  if not u or u.startswith(('http', '//', 'mailto:', 'tel:', 'data:', 'javascript:')) or u.endswith('.html'): continue
                  u = os.path.normpath(u)
                  if u.startswith('..') or not os.path.isfile(u) or u in seen: continue
                  seen.append(u); queue.append(u)
          while queue:
              p = queue.pop(0)
              if not p.endswith(('.css', '.js')): continue
              for m in attr.finditer(open(p, encoding='utf-8', errors='ignore').read()):
                  u = (m.group(1) or m.group(2) or m.group(3) or m.group(4) or '').strip()
                  if not u or u.startswith(('http', '//', 'data:')): continue
                  u = os.path.normpath(os.path.join(os.path.dirname(p), u))
                  if u.startswith('..') or not os.path.isfile(u) or u in seen: continue
                  seen.append(u); queue.append(u)
          for p in seen:
              if b'git-lfs.github.com/spec' in open(p, 'rb').read(200):
                  sys.exit('::error::LFS pointer among the assets; nothing published')
              d = os.path.join(out, os.path.dirname(p))
              if d: os.makedirs(d, exist_ok=True)
              shutil.copy2(p, os.path.join(out, p))
          print('\n'.join(seen))
          PY
          python3 "$RESOLVER" stage dist/mastsolutions/index.html > assets.txt
          echo "$(find stage -type f | wc -l) files staged ($(du -sh stage | cut -f1))"
      - name: Stage the Atlas Glinn preview (noindex)
        run: |
          set -e
          # The Atlas Glinn cinematic pages published here for review only, at /preview/atlasglinn/ — atlasglinn.com is
          # still WordPress and nothing here touches it. Every page is served noindex/nofollow with its canonical and
          # og:url stripped, and robots.txt disallows /preview/, so this host never competes with the live site.
          # The twelve pages scripts/assemble-atlas.py generates, plus the three hand-authored ones it does not.
          RESOLVER="${RUNNER_TEMP:-/tmp}/resolve-assets.py"
          PREVIEW=stage/preview/atlasglinn
          pages=""
          for f in index.html executive-protection.html residential-protection.html disaster-recovery.html training.html \
                   technology.html cuas-aerodefense.html uas.html about.html careers.html contact.html ep-app.html \
                   signup.html privacy.html terms.html; do
            [ -f "$f" ] && pages="$pages $f"
          done
          test -n "$pages" || { echo "::error::no Atlas pages at the repo root; nothing to preview"; exit 1; }
          mkdir -p "$PREVIEW"
          python3 - "$PREVIEW" $pages <<'PY'
          import os, re, sys
          out, pages = sys.argv[1], sys.argv[2:]
          NOINDEX = '<meta name="robots" content="noindex, nofollow">'
          robots = re.compile(r'<meta\s+name=["\']robots["\'][^>]*>', re.I)
          charset = re.compile(r'<meta\s+charset=[^>]*>', re.I)
          drop = re.compile(r'[ \t]*<link\b[^>]*\brel=["\']canonical["\'][^>]*>\n?|[ \t]*<meta\b[^>]*["\']og:url["\'][^>]*>\n?', re.I)
          # A root-absolute reference would leave the subfolder and 404 on this host; where it names something the repo
          # has, it becomes relative so it resolves next to the page. Anything else (a WordPress URL, an off-site link)
          # is left alone.
          absref = re.compile(r'''((?:src|href|poster)=["']|url\(["']?)/([^"'()\s#?]+)''')
          rewritten = []
          for page in pages:
              html = open(page, encoding='utf-8').read()
              html, n = robots.subn(NOINDEX, html, count=1)
              if not n: html = charset.sub(lambda m: m.group(0) + '\n' + NOINDEX, html, count=1)
              assert NOINDEX in html, page + ': no robots meta and no charset meta to put one after'
              html = drop.sub('', html)
              def rel(m):
                  for cand in (m.group(2), m.group(2) + '.html', m.group(2) + '/index.html'):
                      if os.path.isfile(cand):
                          rewritten.append('%s: /%s -> %s' % (page, m.group(2), cand)); return m.group(1) + cand
                  return m.group(0)
              html = absref.sub(rel, html)
              open(os.path.join(out, os.path.basename(page)), 'w', encoding='utf-8').write(html)
          print('%d pages staged noindex, %d root-absolute references made relative' % (len(pages), len(rewritten)))
          for r in rewritten: print('  ' + r)
          PY
          python3 "$RESOLVER" "$PREVIEW" $pages >> assets.txt
          # The pages fetch this to notice a new build; an empty one keeps that from being a 404 in the preview.
          printf '{}\n' > "$PREVIEW/build-manifest.json"
          echo "$(find $PREVIEW -type f | wc -l) preview files ($(du -sh $PREVIEW | cut -f1)); stage now $(find stage -type f | wc -l) files ($(du -sh stage | cut -f1))"
      - name: Make sure the Pages site exists and builds from Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cur="$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null)"; rc=$?
          if [ $rc -ne 0 ]; then
            echo "no Pages site yet; creating one built by Actions"
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null && echo "created" || echo "::warning::could not create the Pages site with the workflow token; Settings → Pages → Source: GitHub Actions does it by hand"
          else
            echo "Pages site: build_type=$(printf '%s' "$cur" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("build_type"), "cname=" + str(d.get("cname")), "https=" + str(d.get("https_enforced")))')"
            printf '%s' "$cur" | grep -q '"build_type": *"workflow"' || { gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null && echo "switched to Actions builds" || echo "::warning::could not switch the Pages source with the workflow token; Settings → Pages → Source: GitHub Actions does it by hand"; }
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stage
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Set the custom domain and print the DNS rows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f cname="$DOMAIN" >/dev/null 2>&1; then echo "custom domain set: $DOMAIN"; else echo "::warning::custom domain not set by the workflow token — Settings → Pages → Custom domain: $DOMAIN (one field)"; fi
          sleep 5; gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Pages:", d.get("html_url"), "cname=" + str(d.get("cname")), "status=" + str(d.get("status")), "https=" + str(d.get("https_enforced")))'
          echo "--- DNS at GoDaddy (Domains → mastsolutions.com) — what serves this: Forwarding mastsolutions.com → https://$DOMAIN (301, forward only; its two apex A rows are GoDaddy's own) and"
          echo "   CNAME  www  matthewbrockmann.github.io"
          echo "--- DNS now:"; echo "   A mastsolutions.com: $(dig +short A mastsolutions.com @1.1.1.1 | tr '\n' ' ')"; echo "   $DOMAIN: $(dig +short $DOMAIN @1.1.1.1 | tr '\n' ' ')"
          for u in "https://mastsolutions.com/" "https://$DOMAIN/"; do echo "   $u → $(curl -sS -m 30 -o /tmp/p -w '%{http_code} %{redirect_url}' "$u" 2>/dev/null || echo unreachable)  title=[$(grep -o '<title>[^<]*' /tmp/p 2>/dev/null | head -1 | sed 's/<title>//')]"; done
