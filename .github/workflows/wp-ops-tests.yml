# The repo's shell/PHP harnesses, on the runner. The two wp-ops ones stub everything they touch — a stub WordPress and a stub WPaaS\Cache_V2
# for the plugin, stub sftp/curl/security/shasum/sleep for the deploy script — so this job reaches no host, needs no
# secret and changes nothing. It exists because the harnesses only ran when someone remembered to run them on the Mac,
# and the plugin they cover is what purges a production cache.
name: wp-ops tests

on:
  push:
    paths:
      - 'wp-ops/**'
      - 'scripts/wp-*.sh'
      - 'scripts/tests/**'
      - '.github/workflows/wp-ops-tests.yml'
      - '.github/workflows/cf-zone-atlasglinn.yml'
  pull_request:
    paths:
      - 'wp-ops/**'
      - 'scripts/wp-*.sh'
      - 'scripts/tests/**'
      - '.github/workflows/wp-ops-tests.yml'
      - '.github/workflows/cf-zone-atlasglinn.yml'
  workflow_dispatch:

permissions:
  contents: read

# NOT a required status check while the paths filters above are here: a pull request that touches nothing under them
# never starts this job, so a required context would sit pending forever and block the merge. Making it required means
# dropping the filters (or adding a paths-ignore twin that reports success) first.
jobs:
  harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: php -v | head -1; bash --version | head -1

      # `|| exit 1`, never `&& echo ok`: the job's shell is `bash -e`, and -e is EXEMPT from the left-hand side of an
      # && list, so `bash -n "$s" && echo ok` swallowed every syntax error in the loop and the step still went green.
      - name: Syntax
        run: |
          for f in wp-ops/atlas-cache-watch.php wp-ops/tests/atlas-cache-watch-test.php wp-ops/atlas-static-root.php wp-ops/tests/atlas-static-root-test.php; do
            php -l "$f" || exit 1
          done
          for s in scripts/wp-cache-watch-deploy.sh scripts/wp-flush.sh scripts/tests/wp-cache-watch-deploy-test.sh; do
            bash -n "$s" || exit 1
            echo "bash -n ok: $s"
          done

      - name: Plugin harness (stub WordPress, 6 scenarios)
        run: php wp-ops/tests/atlas-cache-watch-test.php

      - name: Deploy-script harness (stub sftp/curl, no host)
        run: bash scripts/tests/wp-cache-watch-deploy-test.sh

      # The root-switch harness was fired-observed but wired to nothing until 2026-09-08 (round-3 verifier): a commit could
      # change wp-ops/atlas-static-root.php and CI went green without running one of its 282 cases. Every child PHP it
      # spawns writes error_log into its own run directory under a file-size ulimit, because a mutant once wrote 3.47 GB.
      - name: Static-root harness (fake docroot, 282 pinned cases)
        run: |
          ulimit -f 200000
          php -d error_log="$RUNNER_TEMP/atlas-static-root-parent.log" -d log_errors_max_len=1024 wp-ops/tests/atlas-static-root-test.php

  # cf-zone-atlasglinn.yml can create a DNS zone for a live domain that carries company mail, and it is dispatched by
  # hand at the moment it matters — so its failing paths have to be proved somewhere that is not that moment. This job
  # extracts that workflow's own run blocks with PyYAML and drives them against a canned Cloudflare on localhost. It
  # reaches no network, needs no secret, and creates nothing. Two of its cases are the false successes the first draft
  # shipped with (an import still growing at the deadline, and a missing www, each printing "Import verified" and the
  # nameservers to paste); both must FAIL, and the run also greps every byte it produced for a record value, because
  # this repository is public and so is every Actions log in it.
  cf-zone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml

      - name: Syntax
        run: |
          bash -n scripts/tests/cf-zone-test.sh || exit 1
          python3 -m py_compile scripts/tests/cf-zone-emu.py || exit 1
          echo "bash -n + py_compile ok"

      - name: cf-zone harness (canned Cloudflare on localhost, no secret, nothing created)
        run: bash scripts/tests/cf-zone-test.sh
