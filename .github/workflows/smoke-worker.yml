# Live check of the MAST booking Worker from a GitHub runner (the cloud container has no route to workers.dev).
# Read-only by default: /health, /catalog, /weekends, the CORS preflight, /account/me (503 accounts_off = ACCOUNT_SECRET
# not set on the Worker; 401 = accounts on) and the mail DNS of mastsolutions.com. With contact=true it posts one clearly
# labelled test message through /contact — the Worker emails it to NOTIFY_EMAIL through Resend, so the owner can confirm
# the mail path end to end. With checkout=true it creates one unpaid Stripe Checkout Session for the first bookable SKU
# and prints the host of the URL it gets back (nothing is charged; the session expires on its own and the daily cron
# drops the abandoned registration). Results go to the job summary and to
# claude/desktop-assets:reference/desktop/live/_worker-smoke.txt, readable from any session with
#   git fetch origin claude/desktop-assets:refs/remotes/origin/claude/desktop-assets
#   git show origin/claude/desktop-assets:reference/desktop/live/_worker-smoke.txt
name: Smoke-test the MAST Worker
on:
  workflow_dispatch:
    inputs:
      contact:
        description: "POST one labelled test message to /contact (the Worker emails NOTIFY_EMAIL)"
        type: boolean
        default: true
      checkout:
        description: "Create one unpaid Stripe Checkout Session through /create-booking"
        type: boolean
        default: false
      account:
        description: "Exercise sign-up: POST /account/register for matthew+smoke<run>@atlasglinn.com (the Worker emails a code), then a wrong-password /account/login"
        type: boolean
        default: false
# contents: write, not read — the last step commits the report to the claude/desktop-assets branch, which is the whole
# point of the workflow. Declaring the block at all is what drops every other scope (packages, actions, id-token …) to none.
permissions:
  contents: write
env:
  WORKER: https://mast-booking-backend.matthew-221.workers.dev
  ORIGIN: https://atlasglinn.com
  BRANCH: claude/desktop-assets
  DEST: reference/desktop/live
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the Worker
        env:
          DO_CONTACT: ${{ inputs.contact }}
          DO_CHECKOUT: ${{ inputs.checkout }}
          DO_ACCOUNT: ${{ inputs.account }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          mkdir -p out
          req() {   # method path [json]: prints "HTTP <code> <ms>ms" and the body (Stripe checkout URLs cut to their host)
            local m="$1" p="$2" body="${3:-}" t0 t1 code
            t0=$(date +%s%N)
            if [ -n "$body" ]; then
              code=$(curl -sS -m 40 -o /tmp/b -w '%{http_code}' -X "$m" -H "Content-Type: application/json" -H "Origin: $ORIGIN" --data "$body" "$WORKER$p" || echo ERR)
            else
              code=$(curl -sS -m 40 -o /tmp/b -w '%{http_code}' -X "$m" -H "Origin: $ORIGIN" "$WORKER$p" || echo ERR)
            fi
            t1=$(date +%s%N)
            echo "HTTP $code $(( (t1 - t0) / 1000000 ))ms  $m $p"
            sed -E 's#(https://checkout\.stripe\.com/)[^" ]*#\1…#g' /tmp/b | head -c 1500; echo
          }
          {
            echo "smoke $(date -u +%FT%TZ) from $GITHUB_REF_NAME ${GITHUB_SHA::7} run $GITHUB_RUN_ID (contact=$DO_CONTACT checkout=$DO_CHECKOUT account=$DO_ACCOUNT)"
            echo "--- health"; req GET /health
            # Which merge is running: /health carries build (the commit of the last deploy, set by wp-upload.sh / deploy-worker.yml)
            # and crm:true since the CRM build; on an older build both are absent and GET /admin/crm is a 404 (401 once the CRM
            # routes exist; nothing is written by the probe).
            build=$(python3 -c 'import json,sys; d=json.load(open("/tmp/b")); print(d.get("build") or "none (deployed before the build tag, or by hand)")' 2>/dev/null || echo unknown)
            adm=$(curl -sS -m 40 -o /dev/null -w '%{http_code}' -H "Origin: $ORIGIN" "$WORKER/admin/crm" || echo ERR)
            case "$adm" in 401) crm="yes (GET /admin/crm → 401 without a key)";; 404) crm="NO — the Worker still runs the pre-CRM build (GET /admin/crm → 404); a deploy from the Mac or deploy-worker.yml is missing";; *) crm="unclear (GET /admin/crm → HTTP $adm)";; esac
            echo "   build: $build"
            echo "   CRM routes live: $crm"
            echo "   range directions: $(python3 -c 'import json; print(json.load(open("/tmp/b")).get("directions"))' 2>/dev/null)   [sealed = the owner's PDF decrypts on the Worker; secrets = rendered from RANGE_*; none = nothing attached; sealed-key-mismatch = re-seal with the key below]"
            echo "--- directions key (the public half of the Worker's sealing key; feeds mast-backend/seal-directions.mjs; saved beside this report as _directions-key.json)"
            code=$(curl -sS -m 40 -o out/_directions-key.json -w '%{http_code}' "$WORKER/directions-key" || echo ERR)
            echo "HTTP $code  key_id=$(python3 -c 'import json; print(json.load(open("out/_directions-key.json")).get("key_id"))' 2>/dev/null || echo '-')"
            [ "$code" = 200 ] || rm -f out/_directions-key.json
            echo "--- catalog"; req GET /catalog | head -1
            python3 - /tmp/b <<'PY' || true
          import json, sys
          d = json.load(open(sys.argv[1])); cl = d.get('classes', [])
          print('   source=%s classes=%d' % (d.get('source'), len(cl)))
          for c in cl: print('   %-16s %-44s $%.2f' % (c.get('sku'), (c.get('name') or '')[:44], (c.get('price_cents') or 0) / 100))
          PY
            echo "--- weekends"; req GET /weekends | head -1
            python3 - /tmp/b <<'PY' || true
          import json, sys
          d = json.load(open(sys.argv[1])); w = d.get('weekends', [])
          print('   weekends=%d first=%s last=%s statuses=%s' % (len(w), w[0].get('saturday') if w else None, w[-1].get('saturday') if w else None, sorted(set(str(x.get('status')) for x in w))))
          PY
            echo "--- CORS preflight (Origin $ORIGIN → POST /create-booking)"
            curl -sS -m 40 -o /dev/null -D - -X OPTIONS -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" "$WORKER/create-booking" | tr -d '\r' | grep -iE '^(HTTP|access-control-)' | sed 's/^/   /' || true
            echo "--- accounts (GET /account/me without a token: 503 accounts_off = ACCOUNT_SECRET not set; 401 = accounts on)"; req GET /account/me
            if [ -n "$ADMIN_KEY" ]; then
              # Counts, revenue and the funnel are the owner's business figures. They go to the JOB SUMMARY ONLY, which is
              # visible to whoever can read the run — never into out/_worker-smoke.txt, which is committed to a branch
              # (2026-09-08 security review). Written to /tmp/crm.txt outside this block, appended to the summary after it.
              echo "--- CRM summary: read from the job summary of this run (counts and revenue are never committed to the report file)"
            else echo "--- CRM summary and Stripe Tax status: skipped (no ADMIN_KEY repository secret; add it under Settings → Secrets → Actions to see counts, revenue, the funnel and whether Stripe Tax is collecting for Texas in this run's job summary)"; fi
            if [ "$DO_CONTACT" = "true" ]; then
              echo "--- contact (one labelled test message; the Worker emails NOTIFY_EMAIL through Resend)"
              req POST /contact "{\"name\":\"Smoke test (GitHub Actions)\",\"email\":\"atlasglinn.hq@atlasglinn.com\",\"message\":\"Automated smoke test of the MAST Worker, run $GITHUB_RUN_ID at $(date -u +%FT%TZ). If you read this, the /contact route, Resend and the NOTIFY_EMAIL mailbox all work. No reply needed.\",\"request_type\":\"smoke\",\"page\":\"github-actions\"}"
            else echo "--- contact: skipped (input contact=false)"; fi
            if [ "$DO_CHECKOUT" = "true" ]; then
              sku=$(curl -sS -m 40 "$WORKER/catalog" | python3 -c 'import json,sys; cl=[c for c in json.load(sys.stdin).get("classes",[]) if (c.get("price_cents") or 0)>=100]; print(cl[0]["sku"] if cl else "")')
              echo "--- checkout (one unpaid Stripe Checkout Session for $sku; nothing is charged)"
              req POST /create-booking "{\"sku\":\"$sku\",\"qty\":1,\"customer_email\":\"atlasglinn.hq@atlasglinn.com\",\"customer_name\":\"SMOKE TEST - ignore\",\"notes\":\"GitHub Actions smoke test run $GITHUB_RUN_ID; not a real booking\"}"
            else echo "--- checkout: skipped (input checkout=false)"; fi
            if [ "$DO_ACCOUNT" = "true" ]; then
              # 2026-09-08, owner: "Sign in / ADD ACCOUNT does not work — check all sign up capability + email". The page's
              # sign-up posts /account/register and waits for an emailed code; the answer here says which half is broken:
              # 200 = account row written and the code went out through Resend (the owner's mailbox gets it via plus-addressing)
              # 503 accounts_off = ACCOUNT_SECRET missing on the Worker · 503 email_off = RESEND_API_KEY missing · 5xx email_failed = Resend rejected it
              # The password is random, not derived from the public run id, and is masked so no later step can print it.
              em="matthew+smoke$GITHUB_RUN_ID@atlasglinn.com"; pw="$(openssl rand -hex 24)"; echo "::add-mask::$pw"
              echo "--- account sign-up (POST /account/register for $em)"
              req POST /account/register "{\"email\":\"$em\",\"password\":\"$pw\",\"name\":\"Smoke test (GitHub Actions)\"}"
              echo "--- account sign-in, wrong password (expect 401 or 403 unverified, never 5xx)"
              req POST /account/login "{\"email\":\"$em\",\"password\":\"not-the-password-1\"}"
            else echo "--- account: skipped (input account=false)"; fi
            echo "--- sitemaps and robots (what Search Console can fetch)"
            for u in https://www.mastsolutions.com/sitemap.xml https://www.mastsolutions.com/robots.txt https://atlasglinn.com/wp-sitemap.xml https://atlasglinn.com/sitemap.xml https://atlasglinn.com/sitemap_index.xml https://atlasglinn.com/robots.txt; do
              printf '   %s  HTTP %s\n' "$u" "$(curl -sS -m 30 -o /tmp/s -w '%{http_code}' -A 'Mozilla/5.0 (compatible; smoke-worker)' "$u" 2>/dev/null || echo ERR)"; [ -s /tmp/s ] && head -c 160 /tmp/s | tr '\n' ' ' | sed 's/^/      /' && echo
            done
            # Asked at the zone's own nameserver (ns27.domaincontrol.com), so a row added a minute ago shows without waiting
            # for the hour-long TTL to run out at public resolvers; 1.1.1.1 is the fallback.
            NS1="$(dig +short NS mastsolutions.com @1.1.1.1 | head -1)"; NS1="${NS1:-ns27.domaincontrol.com}"
            echo "--- mail DNS (mastsolutions.com), asked at $NS1 (authoritative)"
            # A / CNAME rows first (2026-09-07, "when I use www.mastsolutions.com it should be that url"): where the two hosts point today.
            for q in "A mastsolutions.com" "CNAME www.mastsolutions.com" "A www.mastsolutions.com" "A atlasglinn.com" "CNAME www.atlasglinn.com" "TXT mastsolutions.com" "MX mastsolutions.com" "TXT send.mastsolutions.com" "MX send.mastsolutions.com" "TXT _dmarc.mastsolutions.com" "TXT resend._domainkey.mastsolutions.com" "CNAME selector1._domainkey.mastsolutions.com" "CNAME selector2._domainkey.mastsolutions.com" "CNAME autodiscover.mastsolutions.com" "TXT atlasglinn.com" "TXT _dmarc.atlasglinn.com" "CNAME selector1._domainkey.atlasglinn.com" "CNAME selector2._domainkey.atlasglinn.com"; do
              set -- $q; src=auth; v="$(dig +short +time=5 +tries=1 "$1" "$2" "@$NS1" 2>/dev/null || true)"
              if [ -z "$v" ] && ! dig +time=5 +tries=1 "$1" "$2" "@$NS1" 2>/dev/null | grep -q 'status: NOERROR'; then src=fallback; v="$(dig +short "$1" "$2" @1.1.1.1 2>/dev/null || true)"; fi
              echo "   $1 $2 [$src]: $(printf '%s' "$v" | sed -E 's/re_[A-Za-z0-9_]+/re_[redacted]/g; s/(p=MIGf)[A-Za-z0-9+\/=]{20,}/\1…/' | tr '\n' '|')"
            done
            # The owner's GoDaddy list also holds mastsolutionssearch.com; a row that lands there by mistake shows here.
            echo "   (wrong-domain check) TXT mastsolutionssearch.com: $(dig +short TXT mastsolutionssearch.com @ns39.domaincontrol.com 2>/dev/null | tr '\n' '|')"
            # Microsoft 365 DKIM rows, derived instead of asked for (2026-09-08, owner: "Enabled = NO CNAMES"): Exchange's public
            # GetFederationInformation names the tenant's onmicrosoft.com domain; M365's two CNAME targets follow from it, and a
            # TXT lookup on each target says whether the tenant has published the key yet (no key = "Create DKIM keys" first).
            for d in mastsolutions.com atlasglinn.com; do
              body='<?xml version="1.0" encoding="utf-8"?><soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/" xmlns:a="http://www.w3.org/2005/08/addressing"><soap:Header><a:Action soap:mustUnderstand="1">http://schemas.microsoft.com/exchange/2010/Autodiscover/Autodiscover/GetFederationInformation</a:Action><a:To soap:mustUnderstand="1">https://autodiscover-s.outlook.com/autodiscover/autodiscover.svc</a:To><a:ReplyTo><a:Address>http://www.w3.org/2005/08/addressing/anonymous</a:Address></a:ReplyTo></soap:Header><soap:Body><GetFederationInformationRequestMessage xmlns="http://schemas.microsoft.com/exchange/2010/Autodiscover"><Request><Domain>'"$d"'</Domain></Request></GetFederationInformationRequestMessage></soap:Body></soap:Envelope>'
              code="$(curl -sS -m 30 -o /tmp/fed.xml -w '%{http_code}' -X POST https://autodiscover-s.outlook.com/autodiscover/autodiscover.svc -H 'Content-Type: text/xml; charset=utf-8' -H 'SOAPAction: "http://schemas.microsoft.com/exchange/2010/Autodiscover/Autodiscover/GetFederationInformation"' -H 'User-Agent: AutodiscoverClient' -H 'Expect:' --data-binary "$body" 2>/tmp/fed.err || echo ERR)"
              tenant="$(grep -o '[A-Za-z0-9-]*\.onmicrosoft\.com' /tmp/fed.xml 2>/dev/null | grep -v '^mail\.' | grep -v '\.mail\.' | head -1)"
              dd="$(printf '%s' "$d" | tr . -)"
              echo "--- Microsoft 365 DKIM rows for $d (tenant: ${tenant:-not found via autodiscover}; http $code$( [ -z "$tenant" ] && printf '; response: %s %s' "$(head -c 300 /tmp/fed.xml 2>/dev/null | tr '\n' ' ')" "$(head -c 120 /tmp/fed.err 2>/dev/null)"))"
              # Fallback when autodiscover gives nothing: the common initial-domain guesses, confirmed only by a published key.
              if [ -z "$tenant" ]; then
                for g in "${dd%-com}.onmicrosoft.com" "${dd%-com}llc.onmicrosoft.com" "${dd%-com}com.onmicrosoft.com"; do
                  if [ -n "$(dig +short TXT "selector1-$dd._domainkey.$g" @1.1.1.1 2>/dev/null)" ]; then tenant="$g"; echo "   (tenant found by guess: $g)"; break; fi
                done
              fi
              if [ -n "$tenant" ]; then
                for s in selector1 selector2; do
                  tgt="$s-$dd._domainkey.$tenant"
                  key="$(dig +short TXT "$tgt" @1.1.1.1 2>/dev/null | head -c 30)"
                  echo "   CNAME  $s._domainkey  ->  $tgt   [key published by Microsoft: $([ -n "$key" ] && echo yes || echo "NO - Defender > DKIM > $d > Create DKIM keys first")]"
                done
              fi
            done
            echo "   (no v=spf1 … include:spf.protection.outlook.com on the apex TXT = Microsoft 365 mail from @mastsolutions.com is unauthenticated; two v=spf1 rows on send. = SPF permerror for Resend's envelope)"
          } | tee out/_worker-smoke.txt
          # Second guard, independent of where each block writes: any line in the COMMITTED file that looks like a
          # business figure is replaced before it can be copied to the handoff branch. Belt and braces — the CRM block
          # above already never reaches this file, and this catches whatever a future edit adds that does.
          python3 - out/_worker-smoke.txt <<'PY'
          import re, sys
          # Anchored to the CRM fields by NAME, and never to money on its own. The bare '$[0-9]' alternative that used to
          # sit here matched every line of the CATALOG PRICE TABLE — "MAST-HG-FUND  Handgun Fundamentals  $225.00" — and
          # redacted the server-side-pricing invariant, the headline thing this report exists to prove, out of the
          # committed file (security review round 2, 2026-09-08). The CRM block prints "profiles=412 leads=93" with '=',
          # so both separators are matched; 'revenue total=' and 'last30=' are named because the words on that line are
          # separated by a space and no name-then-separator form reaches them.
          #
          # The CRM block below prints FIVE lines and this pattern covered four (security review round 3, 2026-09-08):
          # 'journeys=… providers=…' went through untouched. Every field name the block prints is now listed, and adding
          # a print there means adding its name here — the list is the contract.
          pat = re.compile(r'funnel|segments|revenue total=|last30=|(?:revenue|leads|profiles|orders|subscribers|opted_in|registrations|accounts|journeys|providers)\s*[:=]', re.I)
          path = sys.argv[1]; out = []; hits = 0
          for line in open(path, encoding='utf-8', errors='replace').read().split('\n'):
              if pat.search(line): out.append('   [redacted by the smoke report guard]'); hits += 1
              else: out.append(line)
          open(path, 'w', encoding='utf-8').write('\n'.join(out))
          print('report guard: %d line(s) redacted from the committed file' % hits)
          PY
          { echo '```'; cat out/_worker-smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # The fallback for a body Python could not parse — a Cloudflare 1101, a WAF block page, an HTML 502. It used to
          # print the first 400 bytes of that body VERBATIM into the job summary, walking straight past the scrub defined
          # two lines below its own call (security review, 2026-09-09: reproduced with an edge error page carrying a key
          # shape). One function, used by both blocks, so the unparseable path is scrubbed exactly like the JSON one.
          scrub_head () { ADMIN_KEY="$ADMIN_KEY" python3 -c 'import os,re,sys;t=open(sys.argv[1],encoding="utf-8",errors="replace").read()[:400];k=os.environ.get("ADMIN_KEY");t=t.replace(k,"[redacted]") if k else t;t=re.sub(r"(sk_(?:live|test)_|rk_(?:live|test)_|pk_(?:live|test)_|whsec_|re_)[A-Za-z0-9_-]+",r"\1[redacted]",t);print(re.sub(r"(?i)Bearer\s+[A-Za-z0-9._~+/-]{8,}=*","Bearer [redacted]",t))' "$1"; }
          # The CRM figures, in this run's job summary and nowhere else.
          if [ -n "$ADMIN_KEY" ]; then
            code=$(curl -sS -m 40 -o /tmp/crm.json -w '%{http_code}' -H "X-Admin-Key: $ADMIN_KEY" "$WORKER/admin/crm?view=summary" || echo ERR)
            { echo; echo '### CRM summary (this run only — not committed)'; echo '```'; echo "HTTP $code"
              python3 - /tmp/crm.json <<'PY' || scrub_head /tmp/crm.json
          import json, sys
          d = json.load(open(sys.argv[1])); s = d.get('stats', {})
          print('   profiles=%s opted_in=%s leads=%s subscribers=%s accounts=%s' % (s.get('profiles'), s.get('opted_in'), (s.get('leads') or {}).get('total'), s.get('subscribers'), (s.get('accounts') or {}).get('verified')))
          print('   orders paid=%s revenue total=$%.2f last30=$%.2f' % ((s.get('orders') or {}).get('paid'), (s.get('revenue_cents') or {}).get('total', 0) / 100, (s.get('revenue_cents') or {}).get('last_30_days', 0) / 100))
          print('   registrations=%s funnel(30d)=%s' % ((s.get('registrations') or {}).get('by_status'), {k: v for k, v in (s.get('funnel') or {}).items() if not isinstance(v, list)}))
          print('   segments=%s' % {k: v.get('count') for k, v in (d.get('segments') or {}).items()})
          print('   journeys=%s providers=%s' % (s.get('journeys'), s.get('providers')))
          PY
              echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            rm -f /tmp/crm.json
            # Stripe Tax, READ ONLY — and read-only now means it: the dry form answers from the Worker's D1 alone. No
            # Stripe call, no row written, so this probe cannot change the readiness every checkout gates on. (Through
            # round 3 it re-measured the account and rewrote that row while this heading said nothing was written; a
            # smoke run that caught a Stripe timeout left the next minute of checkouts untaxed.) The account itself —
            # settings, the registration — is read by the WRITING form, which deploy-worker.yml runs after each deploy.
            code=$(curl -sS -m 40 -o /tmp/tax.json -w '%{http_code}' -H "X-Admin-Key: $ADMIN_KEY" "$WORKER/admin/tax/setup?dry=1" || echo ERR)
            { echo; echo '### Stripe Tax — Houston, Texas (read-only: the cached measurement and the heartbeat, from D1)'; echo '```'; echo "HTTP $code"
              ADMIN_KEY="$ADMIN_KEY" python3 - /tmp/tax.json <<'PY' || scrub_head /tmp/tax.json
          import json, os, re, sys
          scrub = lambda t: re.sub(r'(?i)Bearer\s+[A-Za-z0-9._~+/-]{8,}=*', 'Bearer [redacted]', re.sub(r'(sk_(?:live|test)_|rk_(?:live|test)_|pk_(?:live|test)_|whsec_|re_)[A-Za-z0-9_-]+', r'\1[redacted]', str(t).replace(os.environ.get('ADMIN_KEY') or '\0', '[redacted]')))
          d = json.load(open(sys.argv[1])); cache = d.get('tax_ready_cache') or {}; run = d.get('last_run')
          # collecting is the WORKER's own measurement (tax_ready), not this workflow's opinion of two fields — it is the
          # exact boolean every checkout gates on, so this line cannot disagree with what the Worker actually does.
          # Scrubbed here as well as at the source: two layers, one pattern set, and neither trusts the other's coverage.
          if d.get('tax_ready') is True:
              print('   collecting: YES — the last measurement found Stripe Tax active with an active US/TX state_sales_tax registration')
          else:
              print('   collecting: NO (%s) — the Worker retries this itself: the 5-minute trigger, the daily cron, and the next checkout that finds the measurement due' % scrub(d.get('tax_ready_reason')))
          # The cache IS the gate. grace says how long a measurement that said READY keeps orders taxed while nothing
          # re-measures. Round 3's field could only ever print age 0 / cached false, so none of this was visible.
          # cache.stale says a RE-MEASUREMENT is overdue and nothing more: a Stripe outage leaves it true while the
          # trigger fires on time every five minutes and correctly declines to overwrite a good row. The trigger's own
          # liveness is last_run below — reading a dead loop out of this line is reading the wrong measurement.
          print('   tax_ready=%s  measured_at=%s  age=%ss  TTL=%ss  grace=%ss  stale=%s%s' % (
              d.get('tax_ready'), cache.get('measured_at'), cache.get('age_seconds'), cache.get('ttl_seconds'),
              cache.get('grace_seconds'), cache.get('stale'), '  ** a re-measurement is overdue **' if cache.get('stale') else ''))
          if cache.get('cached') is not True:
              print('   no measurement is cached at all — nothing has run since the last D1 reset, or D1 is not bound. Checkout sells untaxed until one does.')
          # Wired is not firing: a setup loop that quietly stopped shows up here as a stale stamp, instead of as tax that
          # silently is not being collected.
          if run: print('   last setup run: %s  outcome=%s  age=%sh%s' % (run.get('at'), scrub(run.get('outcome')), run.get('age_hours'), '  ** STALE (>25h) **' if run.get('stale') else ''))
          else:   print('   last setup run: none recorded — no setup has run since the last D1 reset, or D1 is not bound')
          # THE DOUBLE FAULT, and the one number here that can be loud while every other field on this page looks
          # healthy: tax endpoints unreadable (so the grace holds tax_ready at true) AND Stripe refusing every
          # tax-carrying Session. Reset by a tax-carrying Session Stripe accepts, or by a measurement it answers.
          #
          # THE NUMBER PRINTS ALWAYS; THE WARNING NEEDS THE SECOND HALF MEASURED. The streak is raised by anything that
          # can POST a checkout, so five refusals from one anonymous address on a healthy account used to print a
          # warning asserting that orders were being sold untaxed right now — a claim a counter of refusals does not
          # carry. The Worker reports the corroboration as tax_fallback_alarm (streak past the threshold AND a
          # readiness that is unmeasured or being held by the grace); this line prints what it is told rather than
          # re-deriving it, so the two cannot disagree.
          streak = d.get('tax_fallback_streak') or 0
          print('   tax_fallback_streak=%s  readiness=%s' % (streak, d.get('tax_readiness')))
          if d.get('tax_fallback_alarm') is True:
              print('   ** WARNING: %s consecutive tax-carrying Checkout Sessions were REFUSED by Stripe; readiness is %s, so tax is on the grace rather than on a measurement. That is the double fault. Read last_run for what the measurement is failing on. **' % (streak, d.get('tax_readiness')))
          elif streak >= 3:
              print('   %s consecutive tax-carrying Checkout Sessions were refused by Stripe; readiness is MEASURED, so this is not the double fault — read it as Stripe refusing these bodies, not as the loop being down.' % streak)
          for n in d.get('notes') or []: print('   ' + scrub(n))
          print('   the account itself (settings, registration) is read by POST /admin/tax/setup, which deploy-worker.yml runs after each deploy — this report reads D1 only.')
          PY
              echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            rm -f /tmp/tax.json
          fi
      - name: Commit the report to the handoff branch (sparse, blobless checkout)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "smoke-worker"
          git config --global user.email "actions@users.noreply.github.com"
          mkdir handoff && cd handoff
          git init -q
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --cone
          git sparse-checkout set "$DEST"
          git fetch -q --depth 1 --filter=blob:none origin "$BRANCH"
          git checkout -q -b "$BRANCH" FETCH_HEAD
          mkdir -p "$DEST"
          cp ../out/_worker-smoke.txt "$DEST"/
          [ -f ../out/_directions-key.json ] && cp ../out/_directions-key.json "$DEST"/
          git add -A "$DEST"
          if git diff --cached --quiet; then echo "report unchanged; nothing to commit"; exit 0; fi
          git commit -q -m "Worker smoke test ($(date -u '+%F %H:%M') UTC)"
          for try in 1 2 3; do
            git push -q origin "HEAD:$BRANCH" && break
            echo "push rejected (try $try): $BRANCH moved meanwhile; re-basing onto its new tip"
            [ "$try" = 3 ] && exit 1
            git fetch -q --depth 1 --filter=blob:none origin "$BRANCH"
            git reset -q --mixed FETCH_HEAD
            git add --ignore-removal "$DEST"
            if git diff --cached --quiet; then echo "nothing left to commit after the move"; exit 0; fi
            git commit -q -m "Worker smoke test ($(date -u '+%F %H:%M') UTC)"
          done
          echo "pushed $(git rev-parse --short HEAD) to $BRANCH: $DEST/_worker-smoke.txt"
