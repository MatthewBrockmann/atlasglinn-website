# Reads the live atlasglinn.com pages from a GitHub runner (open internet; the cloud container has no route to the site)
# and commits them to the handoff branch as reference/desktop/live/<slug>.html, the same place scripts/mac-handoff.sh
# saves them from the Mac; file URLs on the same list (the site's films and team pictures) land beside them by basename,
# up to 60 MB each. Owner, 2026-09-05, on the published rebuild: "why the content from the actual site and this
# new site front end are not matching" — no cloud session had ever read the live WordPress text. Runs on request and once
# a day; needs no secret. A probe file beside the pages records what the host serves at /, /index.html, /about.html and a
# few uploaded assets (status, content type, <title>, WordPress generator tag), so the upload state is visible from a
# cloud session too. Read them with:
#   git fetch origin claude/desktop-assets
#   git show origin/claude/desktop-assets:reference/desktop/live/_probe.txt
name: Capture live site

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

concurrency:
  group: capture-live
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36 capture-live'
      BRANCH: claude/desktop-assets
      DEST: reference/desktop/live
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the live pages and files named in scripts/handoff-urls.txt
        run: |
          mkdir -p out
          grep -E '^https?://' scripts/handoff-urls.txt | while read -r u; do
            case "$u" in *youtube.com/*|*youtu.be/*|*instagram.com/*|*vimeo.com/*|*tiktok.com/*|*facebook.com/*|*fb.watch/*) continue ;; esac   # yt-dlp on the Mac
            p="${u#*://}"; p="${p#*/}"; q=""; case "$u" in *\?*) q="${u#*\?}"; q="${q%%#*}" ;; esac; p="${p%%\?*}"; p="${p%%#*}"
            page=1; case "$p" in ""|*/) ;; *) case "${p##*/}" in *.*) page=0 ;; esac ;; esac
            if [ "$page" = 1 ]; then
              s="${p%/}"; s="$(printf '%s' "$s" | tr '/' '-')"; s="${s:-index}"
              # A query string is part of the page identity (shop/?page=2 is not shop/): keep it in the slug so the
              # IWA shop pages 2-5 land beside page 1 instead of overwriting it (2026-09-08).
              [ -n "$q" ] && s="$s-$(printf '%s' "$q" | tr -c 'A-Za-z0-9\n' '-')"
              s="$s.html"
            else
              s="${p##*/}"                                   # a file (image, film): by basename, beside the pages
            fi
            # Files up to 60 MB (GitHub refuses 100 MB); the Mac's handoff compresses bigger films, this job lists them.
            if curl -fsSL -A "$UA" --max-time 300 --max-filesize 60000000 -o "out/$s" "$u"; then
              echo "ok    $u -> $DEST/$s ($(wc -c < "out/$s") bytes)"
            else
              echo "::warning::fetch failed or over 60 MB: $u"; rm -f "out/$s"
            fi
          done
          ls -la out
      - name: Probe what the host serves
        run: |
          {
            echo "captured $(date -u +%FT%TZ) by capture-live from main ${GITHUB_SHA::7}"
            for u in https://atlasglinn.com/ https://atlasglinn.com/index.html https://atlasglinn.com/about.html \
                     https://atlasglinn.com/about/ https://atlasglinn.com/mastsolutions.html \
                     https://atlasglinn.com/images/atlas/Atlas-Glinn-3.jpg \
                     https://atlasglinn.com/images/atlas/Atlas-Glinn-Executive-Protection-scaled.jpeg \
                     https://atlasglinn.com/images/film/atlas-glinn-and-mast-solutions-poster.jpg \
                     https://atlasglinn.com/images/team/brockmann.jpg \
                     https://atlasglinn.com/images/technology-hero.mp4 https://atlasglinn.com/images/careers-gallery.mp4 \
                     https://atlasglinn.com/wp-content/uploads/2025/03/IMG_1837-1024x751.jpeg; do
              rm -f /tmp/p
              code="$(curl -sS -L -A "$UA" --max-time 60 -o /tmp/p -w '%{http_code} %{content_type} %{size_download}' "$u" 2>/dev/null || echo 'ERR - -')"
              t="$(grep -o '<title>[^<]*' /tmp/p 2>/dev/null | head -1 | sed 's/<title>//')"
              w="$(grep -c 'generator" content="WordPress' /tmp/p 2>/dev/null || true)"
              echo "$code  $u  title=[$t] wordpress_generator=$w"
            done
            # Cache-busted copies with the host's caching headers, and the ping file the Mac's upload writes: tells a page
            # the host's cache is holding from a page the upload never replaced (2026-09-06: /mastsolutions.html served a
            # day-old build while /index.html was current).
            ts="$(date +%s)"
            echo "--- cache-busted (?v=$ts) with caching headers; gear-price / foot-site count the current builds' markers"
            for u in https://atlasglinn.com/mastsolutions.html https://atlasglinn.com/index.html https://atlasglinn.com/about.html https://atlasglinn.com/mast-ping.txt; do
              rm -f /tmp/p /tmp/h
              code="$(curl -sS -L -A "$UA" --max-time 60 -D /tmp/h -o /tmp/p -w '%{http_code} %{content_type} %{size_download}' "$u?v=$ts" 2>/dev/null || echo 'ERR - -')"
              hdr="$(grep -i -E '^(last-modified|etag|age|cache-control|x-cache|cf-cache-status|x-cacheable|x-served-by|server|via|x-varnish|x-hits|x-cache-hits):' /tmp/h 2>/dev/null | tr -d '\r' | tr '\n' ' ' | tr -s ' ' || true)"
              g="$(grep -c 'gear-price' /tmp/p 2>/dev/null || true)"; f="$(grep -c 'foot site' /tmp/p 2>/dev/null || true)"
              echo "$code  $u?v=  gear-price=$g foot-site=$f  [$hdr]"
              case "$u" in *mast-ping.txt) echo "   mast-ping.txt body: $(head -c 120 /tmp/p 2>/dev/null | tr -d '\r\n')";; esac
            done
            echo "--- plain URL caching headers"
            for u in https://atlasglinn.com/mastsolutions.html https://atlasglinn.com/index.html; do
              curl -sS -L -A "$UA" --max-time 60 -o /dev/null -D - "$u" 2>/dev/null | grep -i -E '^(HTTP|last-modified|etag|age|cache-control|x-cache|cf-cache-status|x-cacheable|server|content-length|via):' | tr -d '\r' | tr '\n' ' ' | tr -s ' ' | sed "s|^|   $u  |"; echo
            done
            # Self-refresh check (scripts/build_manifest.py): the plain URL's page carries its own hash in <meta name="build">;
            # build-manifest.json (fetched uncached) says what the host holds. "stale" here is what a visitor's browser heals
            # with one reload to ?v=<hash>; "fresh" needs nothing; "no manifest" = the upload has not carried it yet.
            mf="$(curl -sS -L -A "$UA" --max-time 40 "https://atlasglinn.com/build-manifest.json?$ts" 2>/dev/null || true)"
            for u in mastsolutions.html index.html about.html; do
              b="$(curl -sS -L -A "$UA" --max-time 60 "https://atlasglinn.com/$u" 2>/dev/null | grep -o '<meta name="build" content="[0-9a-f]*"' | head -1 | sed 's/.*content="//; s/"$//')"
              want="$(printf '%s' "$mf" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get(sys.argv[1],""))' "$u" 2>/dev/null || true)"
              state="no manifest"; [ -n "$want" ] && { [ "$b" = "$want" ] && state=fresh || state="stale → self-refresh to ?v=$want"; }
              echo "--- self-refresh: $u  plain build=[${b:-none}]  manifest=[${want:-none}]  $state"
            done
            # The Google listing behind the review link (wrangler.toml REVIEW_URL / cinematic_shell.py GOOGLE_REVIEW_URL). The Maps
            # search page by name and address carries the place id (ChIJ…) and the business name in its initial data when
            # Google serves it to a runner; a place id here is what a one-tap write-review link needs
            # (https://search.google.com/local/writereview?placeid=…). Consent walls and JS-only shells show as no matches.
            for gu in 'https://www.google.com/maps/search/?api=1&query=Atlas+Glinn%2C+2450+Fondren+Rd+Suite+255%2C+Houston%2C+TX+77063' 'https://www.google.com/maps?cid=4511758973651106295'; do
              curl -sS -L -A "$UA" --max-time 40 -o /tmp/g "$gu" 2>/dev/null || true
              echo "--- google: $gu"
              echo "   title=[$(grep -o '<title>[^<]*' /tmp/g | head -1 | sed 's/<title>//')]  mentions 'Atlas Glinn'=$(grep -o 'Atlas Glinn' /tmp/g | wc -l | tr -d ' ')  place ids=[$(grep -o 'ChIJ[0-9A-Za-z_-]\{20,40\}' /tmp/g | sort | uniq -c | sort -rn | head -3 | tr '\n' ' ')]  consent=$(grep -c 'consent.google' /tmp/g)"
            done
          } | tee out/_probe.txt
      - name: Commit to the handoff branch (sparse, blobless checkout; the branch carries large media)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "capture-live"
          git config --global user.email "actions@users.noreply.github.com"
          mkdir handoff && cd handoff
          git init -q
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --cone
          git sparse-checkout set "$DEST"
          git fetch -q --depth 1 --filter=blob:none origin "$BRANCH"
          git checkout -q -b "$BRANCH" FETCH_HEAD
          mkdir -p "$DEST"
          cp ../out/* "$DEST"/
          git add -A "$DEST"
          if git diff --cached --quiet; then echo "live pages unchanged; nothing to commit"; exit 0; fi
          git commit -q -m "Capture the live atlasglinn.com pages ($(date -u '+%F %H:%M') UTC)"
          # The Mac's handoff commits to this branch too; if it lands first, put the capture on the new tip and retry.
          for try in 1 2 3; do
            git push -q origin "HEAD:$BRANCH" && break
            echo "push rejected (try $try): $BRANCH moved meanwhile; re-basing the capture onto its new tip"
            [ "$try" = 3 ] && exit 1
            git fetch -q --depth 1 --filter=blob:none origin "$BRANCH"
            git reset -q --mixed FETCH_HEAD
            git add --ignore-removal "$DEST"
            if git diff --cached --quiet; then echo "nothing left to commit after the move"; exit 0; fi
            git commit -q -m "Capture the live atlasglinn.com pages ($(date -u '+%F %H:%M') UTC)"
          done
          echo "pushed $(git rev-parse --short HEAD) to $BRANCH: $DEST/"
