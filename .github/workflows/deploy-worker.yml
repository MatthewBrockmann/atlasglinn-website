# Deploys the MAST booking Worker when mast-backend/ changes on main, so "merged" becomes "running" without a
# Terminal (owner, 2026-09-05: "a PR that you should auto push because I won't be able to use terminal commands").
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token from the Cloudflare dashboard (My Profile → API Tokens → Create Token →
#                          template "Edit Cloudflare Workers", plus D1: Edit) — the token itself never appears here
#   CLOUDFLARE_ACCOUNT_ID  the Account ID shown on the Workers & Pages overview page
# Until both exist the job runs the tests and then stops with a notice; nothing is deployed.
# Worker secrets (Stripe, Resend, ACCOUNT_SECRET, …) live on the Worker already and are untouched by a deploy.
# D1 migrations: applied by the guarded step below (2026-09-08); mast-backend/README.md still describes the Mac command as the fallback.
# Cron schedules: wrangler uploads the script and registers the crons as TWO acts, and run #38 (2026-09-09) had the
# second refused with the first already landed (Workers Free: 5 cron triggers per ACCOUNT, code 10072). The step after
# Deploy reads the registered schedules back out of the API and fails the run when they differ from wrangler.toml.
# DEPLOY ORDER (round 9, 2026-09-09): THE PAGE, then the schema, then the Worker. /account/verify takes
# {email, code, password} since round 7, and the page and the Worker ship on two independent workflows — a new page
# against an old Worker is harmless (the extra field is ignored) and a new Worker against a cached old page is not, so
# the first step of the three waits for www.mastsolutions.com to serve this commit's build hash and fails the run rather
# than landing first. The page moved AHEAD of the migrations in round 9: with the wait between them and the deploy, a
# page that never arrived left 012 applied and the Worker undeployed. Waiting first makes that failure change nothing.
name: Deploy MAST Worker

on:
  push:
    branches: [main]
    paths:
      - 'mast-backend/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

# Least privilege: this workflow only reads the repository. Every other scope becomes 'none' the moment this block exists.
permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mast-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mast-backend/package-lock.json
      # No '|| npm install' fallback: that silently accepted a missing or stale lockfile and installed whatever the
      # registry served that minute, including an unpinned wrangler. A lockfile problem must fail the deploy, not float it.
      - name: Install dependencies (pdf-lib for the agreement, wrangler pinned in devDependencies; the tests import the Worker)
        run: npm ci --no-audit --no-fund
      - name: Tests
        run: node test-worker.mjs
      # The token is what matters; wrangler finds the account on its own when the token sees one account, so the account
      # id is optional. Common alternative names are accepted, and the notice says which names are present (never the
      # values) so a secret saved under the wrong name or tab shows up in the log (2026-09-07: "Cloudflare is in secrets"
      # and the runner still saw nothing).
      # Presence only. The token itself is NEVER written to $GITHUB_OUTPUT (step outputs are readable by every later step
      # and land in the run's object store); each step that needs it takes it from secrets directly, in its own env.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          T1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          T2: ${{ secrets.CF_API_TOKEN }}
          T3: ${{ secrets.CLOUDFLARE_TOKEN }}
          A1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          A2: ${{ secrets.CF_ACCOUNT_ID }}
          A3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          have=""; for n in T1:CLOUDFLARE_API_TOKEN T2:CF_API_TOKEN T3:CLOUDFLARE_TOKEN A1:CLOUDFLARE_ACCOUNT_ID A2:CF_ACCOUNT_ID A3:vars.CLOUDFLARE_ACCOUNT_ID; do
            v="${n%%:*}"; [ -n "${!v}" ] && have="$have ${n#*:}"; done
          echo "present:${have:- none}"
          if [ -z "${T1:-${T2:-$T3}}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cloudflare API token reached this job (present:${have:- none}). It must be a REPOSITORY secret named CLOUDFLARE_API_TOKEN under Settings → Secrets and variables → Actions → Repository secrets (not Variables, not an environment, not Codespaces). Tests ran, deploy skipped."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Short commit id for /health (build = the commit this deploy was made from)
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # THE PAGE GOES FIRST — BEFORE THE SCHEMA AND BEFORE THE WORKER (round 9, 2026-09-09) — and this step enforces it.
      #
      # Round 7 changed the /account/verify contract: it takes {email, code, password} where it used to take {email, code}.
      # The two halves ship on two independent workflows (this one on mast-backend/**, pages-mastsolutions.yml on the
      # page), so on a merge that moves both, whichever runner finishes first is what visitors meet. One order is
      # harmless and the other is not:
      #   page first, Worker second  — the new page posts {email, code, password}; the OLD Worker ignores the extra field
      #                                and verifies on the code, exactly as it always did. Nobody notices.
      #   Worker first, page second  — the cached old page posts {email, code}, and until round 8 the new Worker answered
      #                                401 bad_code, which reads as "your code is wrong" and has no way forward.
      # So this step waits for the page and FAILS the run rather than shipping into the second order. Failing leaves the
      # old Worker serving the new page, which is the harmless combination; re-run this workflow once the Pages publish
      # is green.
      #
      # IT RUNS BEFORE THE MIGRATIONS NOW, NOT BETWEEN THEM AND THE DEPLOY (round 9). It used to sit after them, so a
      # page that never arrived failed the run with 012 APPLIED and the Worker undeployed — the database moved forward
      # under code that had not, which is the one combination neither half is written for. Waiting first means a failure
      # here changes nothing at all: no schema, no code, the old Worker still serving the old page.
      #
      # IT ALWAYS COMPARES, and no longer asks what the push moved (round 9). The old pushed-range test read the compare
      # API and skipped the wait when the range carried no page file, which is wrong in both directions: a re-run or a
      # workflow_dispatch has no range to read at all, and the page can be behind for reasons this push did not cause (a
      # Pages run that failed, a CDN still serving the previous build). The live manifest is the only thing that answers
      # the question the deploy depends on, and when the host already serves this build the answer costs ONE request.
      #
      # The build hash is the page's own content hash (scripts/build_manifest.py), and dist/mastsolutions/build-manifest.json
      # is the copy pages-mastsolutions.yml stages as the site's /build-manifest.json — so the field to compare is
      # "index.html", not "mastsolutions.html" (that key belongs to the atlasglinn.com copy in the ROOT manifest).
      - name: Wait for www.mastsolutions.com to carry this commit's page (before the schema, and before the Worker)
        if: steps.creds.outputs.ready == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          MANIFEST=dist/mastsolutions/build-manifest.json
          test -f "$MANIFEST" || { echo "::error::$MANIFEST is missing — run python3 scripts/assemble-cinematic.py and commit its output"; exit 1; }
          want="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("index.html") or "")' "$MANIFEST")"
          test -n "$want" || { echo "::error::empty build hash in $MANIFEST — it carries no index.html key, so this run cannot tell which page the host serves"; exit 1; }
          echo "waiting for https://www.mastsolutions.com/build-manifest.json to carry index.html=$want (max 10 minutes, every 20 s)"
          for i in $(seq 1 30); do
            live="$(curl -sS -m 20 "https://www.mastsolutions.com/build-manifest.json?ci=$(date +%s)" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("index.html") or "")' 2>/dev/null || true)"
            live="${live//[^0-9a-f]/}"   # a build hash is hex; nothing else from the host is echoed into the log
            if [ "$live" = "$want" ]; then echo "attempt $i: the host serves $live — the page knows the {email, code, password} contract; the schema and the Worker may follow"; exit 0; fi
            echo "attempt $i: host has '${live:-unreachable}', want $want"
            sleep 20
          done
          echo "::error::www.mastsolutions.com still does not serve this commit's page (build $want) after 10 minutes, so NEITHER the migrations NOR the Worker have run — the old Worker keeps serving the new page correctly, which is the safe half of the pair. Check the 'Publish mastsolutions.com (GitHub Pages)' run for this commit, then re-run this workflow."
          exit 1
      # Schema before code (2026-09-08), and AFTER THE PAGE (round 9): the wait above has to pass before a single
      # ALTER runs, so a page that never arrives leaves the database exactly where it was.
      # Migrations used to be a Mac step ("D1 migrations stay a manual step"); the
      # Actions token now carries D1:Edit, so each numbered file in mast-backend/migrations/ is applied here when its
      # columns are missing — a guard, because SQLite's ALTER TABLE ADD COLUMN is not idempotent. Add a row to GUARDS for
      # every new migration: "<file>|<table>|<every column that file adds, comma separated>". Files without a row are not run.
      #
      # EVERY column is checked, not one marker (security review 2026-09-08): 007 adds five columns and the guard read
      # credential_type alone, so a run that died after the first ALTER left four columns missing and looked applied
      # forever after. All present = skip; none present = apply; SOME present = stop, because re-running the file would
      # fail on the first duplicate and a half-applied schema needs a person.
      # A file that CREATEs a table rather than ALTERing one fits the same shape: PRAGMA table_info on a table that does
      # not exist yet returns no rows, so every column reads missing and the file is applied (migrations/012).
      # 010 AND 011 HAVE NO ROWS ANY MORE, AND REMOVING THEM IS THE FIX, NOT AN OVERSIGHT (round 7, 2026-09-09): 012
      # DROPs and recreates pending_signups on a different primary key, so once it has run, 010's eleven columns are
      # half-present by construction (address_digest and created_at survive, verify_code_hash and code_sent_at do not)
      # and this guard would print HALF APPLIED and stop every deploy for ever. 012's row therefore names only the two
      # columns UNIQUE to its shape — signup_id and code_hash — which no earlier shape carries: an old table reads
      # "apply", a new one reads "already applied", and neither can read half. 010's one-time DELETE moved into 012 with
      # it, because a file with no row never runs. Files stay in the tree; the row is what schedules them.
      #
      # WHAT THIS GUARD CANNOT SEE, and it is written down rather than left to be rediscovered: for a file that CREATEs,
      # the columns are not evidence the FILE ran — ensureRateSchema creates the same table at runtime. If a Worker
      # reaches the live environment before 012 does, this step prints "already applied" for ever and 012's one-time
      # `DELETE FROM accounts WHERE verified_at IS NULL` never runs. That is bounded, not zero: runRetention deletes the
      # same set daily on the 09:17 UTC cron, so the legacy rows go within a day either way. What the Worker DOES handle
      # by itself is the shape change: healPendingSignups (src/ratelimit.js) drops a pending_signups that has no
      # signup_id column before the CREATE runs, so a deploy that lands ahead of 012 — the hourly wp-upload.sh path
      # applies no migrations at all — converges instead of writing into a table that cannot take it. See the README
      # residual titled "Nothing here is deployed, and there are TWO live deploy paths" (named, not numbered: round 7
      # inserted one above it and three pointers went on saying 5).
      # npx with no -y and no @version: it resolves the wrangler pinned in mast-backend/package.json + package-lock.json,
      # so the CLI that touches the live database is the one the lockfile names.
      - name: Apply pending D1 migrations (schema before code)
        if: steps.creds.outputs.ready == 'true'
        working-directory: mast-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          GUARDS="migrations/007-account-credentials.sql|accounts|credential_type,credential_org,credential_id,credential_status,credential_submitted_at
          migrations/008-rate-limits.sql|accounts|failed_logins,locked_until,signup_notice_sent_at
          migrations/009-seat-claim.sql|registrations|abandoned_reason
          migrations/012-pending-signup-per-row.sql|pending_signups|signup_id,code_hash"
          echo "$GUARDS" | while IFS= read -r g; do
            g="$(echo "$g" | xargs)"; [ -n "$g" ] || continue
            f="${g%%|*}"; rest="${g#*|}"; tbl="${rest%%|*}"; cols="${rest#*|}"
            test -f "$f" || { echo "::error::$f missing"; exit 1; }
            have=$(npx wrangler d1 execute mast_bookings --remote --json --command "PRAGMA table_info($tbl)" 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print(" ".join(r["name"] for r in d[0]["results"]))')
            missing=""; present=""
            for c in $(echo "$cols" | tr ',' ' '); do
              if echo " $have " | grep -q " $c "; then present="$present $c"; else missing="$missing $c"; fi
            done
            if [ -z "$missing" ]; then echo "$f: already applied ($tbl:$present)"
            elif [ -n "$present" ]; then
              echo "::error::$f is HALF APPLIED on $tbl — present:$present missing:$missing. Re-running the file would fail on the first duplicate column; apply the missing ALTERs by hand, then re-run this workflow."
              exit 1
            else
              npx wrangler d1 execute mast_bookings --remote --file="$f" && echo "$f: applied ($tbl:$(echo "$cols" | tr ',' ' '))"
            fi
          done
      # THE CEILING, PRINTED BEFORE EVERY DEPLOY. Workers Free allows FIVE cron triggers PER ACCOUNT, and run #38
      # (2026-09-09, main e8c12da) found the account at it: wrangler uploaded the script and Cloudflare refused the
      # schedules with code 10072. The count is one line in every run so the next person to add a trigger sees the
      # budget before they spend it, not in a red run afterwards.
      - name: Cron triggers this wrangler.toml declares (Workers Free allows 5 per ACCOUNT)
        if: steps.creds.outputs.ready == 'true'
        working-directory: mast-backend
        run: |
          python3 - <<'PY'
          import re
          toml = open('wrangler.toml', encoding='utf-8').read()
          m = re.search(r'^crons\s*=\s*\[(.*?)\]', toml, re.M | re.S)
          crons = [c.strip().strip('"\'') for c in (m.group(1).split(',') if m else []) if c.strip()]
          print('cron triggers declared IN THIS FILE: %d (Workers Free allows 5 per ACCOUNT, across every script — this step does not measure the account total; run #38 was refused while this file declared 2)' % len(crons))
          if not crons:
              print('::error::wrangler.toml declares NO cron triggers — the [triggers] table moved or was renamed; the tax tick and the daily work would never fire'); raise SystemExit(1)
          for c in crons: print('   ' + c)
          if len(crons) > 5:
              print('::warning::wrangler.toml declares %d cron triggers and Workers Free allows 5 per account — Cloudflare will refuse the schedules with code 10072 AFTER uploading the script, exactly as it did on run #38. The verify step below is what catches that; this line is so it is visible first.' % len(crons))
          PY
      # wranglerVersion matches the devDependency: the action installs its own CLI, so leaving it unset floated the
      # deploy onto whatever wrangler v3 was current that day.
      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.90.0'
          workingDirectory: mast-backend
          command: deploy --var BUILD:${{ steps.sha.outputs.short }}
      # THE UPLOAD IS NOT THE SCHEDULES, and run #38 is the proof. On 2026-09-09, main e8c12da, wrangler PUT the script
      # live and Cloudflare then refused its crons — "This account has reached the Workers Free limit of 5 cron triggers
      # per account" (code 10072). The step failed, but the Worker was already running the new code on the OLD trigger
      # set, and no line anywhere said which half had landed. This step reads the schedules the account actually holds
      # back out of the Cloudflare API and fails the run when they are not the ones wrangler.toml declares.
      #
      # IT FAILS ON A MEASURED DISAGREEMENT AND ON AN ANSWER IT CANNOT READ. A 401/403 (a token without Workers Scripts
      # read) and a transport failure WARN and exit 0 — the API did not answer, and a step that reds main on a missing
      # permission would be turned off within a week. But a 200 whose body cannot be parsed, is not an object, or says
      # success=false is the endpoint ANSWERING and this step being unable to say whether the crons landed — that is
      # exit 1 (round-1 verifier: a check that passes on a malformed answer is a check that passes on anything). An
      # empty declared set is exit 1 too: nothing can be checked against nothing. Both sets land in the step summary.
      - name: Verify the Worker's registered cron schedules are the ones wrangler.toml declares
        # always(): run #38's shape is a FAILED Deploy step with the script already live — the case this check exists for.
        if: always() && steps.creds.outputs.ready == 'true'
        working-directory: mast-backend
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          API=https://api.cloudflare.com/client/v4
          # The account id, in the order it is cheapest to be sure of: the file that names it (wrangler.toml carries it
          # so wrangler can skip the /memberships lookup an Account-owned token cannot make), then the repository
          # secret, then the API's own list — which is one request and only needed when neither of the first two exist.
          acct="$(python3 -c "import re; t=open('wrangler.toml',encoding='utf-8').read(); m=re.search(r'^account_id\s*=\s*[\"\']([^\"\']+)', t, re.M); print(m.group(1) if m else '')")"
          src=wrangler.toml
          if [ -z "$acct" ]; then acct="${CF_ACCOUNT:-}"; src="repository secret"; fi
          if [ -z "$acct" ]; then
            src="the API's /accounts list"
            acct="$(curl -sS -m 30 -H "Authorization: Bearer $CF_TOKEN" "$API/accounts?per_page=1" | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('result') or [];print(r[0].get('id','') if r and isinstance(r[0],dict) else '')" 2>/dev/null || true)"
          fi
          if [ -z "$acct" ]; then
            echo "::warning::No Cloudflare account id from wrangler.toml, from a repository secret, or from the API — the registered schedules could not be read, so this run cannot say whether the crons landed. The deploy itself is unaffected."
            exit 0
          fi
          echo "account id from $src"
          code=$(curl -sS -m 30 -o /tmp/schedules.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "$API/accounts/$acct/workers/scripts/mast-booking-backend/schedules" || echo ERR)
          echo "HTTP $code  GET /accounts/<id>/workers/scripts/mast-booking-backend/schedules"
          python3 - /tmp/schedules.json "$code" <<'PY'
          import json, os, re, sys
          raw = open(sys.argv[1], encoding='utf-8', errors='replace').read() if os.path.exists(sys.argv[1]) else ''
          code = sys.argv[2]
          toml = open('wrangler.toml', encoding='utf-8').read()
          m = re.search(r'^crons\s*=\s*\[(.*?)\]', toml, re.M | re.S)
          want = sorted(c.strip().strip('"\'') for c in (m.group(1).split(',') if m else []) if c.strip())
          summ = open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a')
          def note(line):
              print(line); summ.write(line.replace('::error::', 'ERROR: ').replace('::warning::', 'WARNING: ') + '\n')
          if not want:
              note('::error::this step parsed NO cron triggers out of wrangler.toml — the file moved or the [triggers] table was renamed; the registered set cannot be checked against nothing')
              sys.exit(1)
          if code in ('401', '403'):
              note('::warning::The API token cannot list this Worker\'s schedules (HTTP %s) — it needs Workers Scripts: Read on the account. NOT a deploy failure and nothing is pending on the deploy; what is missing is the check that the crons registered. wrangler.toml declares: %s' % (code, ', '.join(want) or '(none)'))
              sys.exit(0)
          if code != '200':
              note('::warning::Could not read the registered schedules (HTTP %s), so this run cannot confirm the crons landed. The deploy itself succeeded or failed on its own step. wrangler.toml declares: %s' % (code, ', '.join(want) or '(none)'))
              sys.exit(0)
          try:
              d = json.loads(raw)
          except Exception as e:
              note('::error::The schedules endpoint answered 200 with a body this step could not parse (%s): the API answered and this run cannot say whether the crons landed. wrangler.toml declares: %s' % (e.__class__.__name__, ', '.join(want) or '(none)'))
              sys.exit(1)
          if not isinstance(d, dict):
              note('::error::The schedules endpoint answered 200 with a non-object body (%s): the registered set cannot be read. wrangler.toml declares: %s' % (type(d).__name__, ', '.join(want) or '(none)'))
              sys.exit(1)
          if not d.get('success', True):
              errs = '; '.join(str(e.get('message', e)) if isinstance(e, dict) else str(e) for e in (d.get('errors') or []))
              note('::error::The schedules endpoint answered success=false (%s): the registered set cannot be read. wrangler.toml declares: %s' % (errs or 'no message', ', '.join(want) or '(none)'))
              sys.exit(1)
          res = d.get('result')
          items = res.get('schedules') if isinstance(res, dict) else res if isinstance(res, list) else []
          have = sorted(str(i.get('cron', '')).strip() for i in (items or []) if isinstance(i, dict) and i.get('cron'))
          note('registered on the Worker: %s' % (', '.join(have) or '(none)'))
          note('declared in wrangler.toml: %s' % (', '.join(want) or '(none)'))
          if have == want:
              print('The schedules the account holds are the ones this commit declares — the deploy landed whole.')
              sys.exit(0)
          missing = [c for c in want if c not in have]
          extra = [c for c in have if c not in want]
          note('::error::THE WORKER IS RUNNING THIS COMMIT\'S CODE ON A DIFFERENT TRIGGER SET. Missing (declared, NOT registered): %s. Registered but not declared: %s. This is the run #38 shape: wrangler uploads the script and Cloudflare refuses the schedules — on Workers Free that refusal is code 10072, "5 cron triggers per account", and the account keeps whatever triggers it already had. Fix the trigger set (or the plan) and re-run this workflow; the Worker is live either way.' % (', '.join(missing) or '(none)', ', '.join(extra) or '(none)'))
          sys.exit(1)
          PY
      # Worker secrets from a phone: a repository secret named WORKER_RESEND_API_KEY (or WORKER_<NAME> for any other
      # Worker secret) is pushed to the Worker after each deploy, so a rotated key never needs a Terminal. Leave them
      # unset and nothing happens; the value never appears in a log.
      - name: Push Worker secrets that are set as repository secrets
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_RESEND_API_KEY: ${{ secrets.WORKER_RESEND_API_KEY }}
          WORKER_ACCOUNT_SECRET: ${{ secrets.WORKER_ACCOUNT_SECRET }}
          WORKER_NOTIFY_EMAIL: ${{ secrets.WORKER_NOTIFY_EMAIL }}
        run: |
          for name in RESEND_API_KEY ACCOUNT_SECRET NOTIFY_EMAIL; do
            var="WORKER_$name"; val="${!var}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$name" --name mast-booking-backend >/dev/null && echo "secret $name updated on the Worker"
            fi
          done
      # Stripe Tax, REPORTED — not gated. The Worker is tax-self-sufficient: it sends automatic_tax only on an account it
      # has MEASURED as collecting (taxReadyCached, src/worker.js), and when it finds one that is not, it runs the idempotent
      # setup itself — from its daily cron, and from the first checkout that notices. So this step no longer decides
      # whether a tax-enabled deploy is safe; the Worker does, on every single request, which is the only place that can.
      #
      # What it still does, with a repository secret ADMIN_KEY: run the setup NOW rather than waiting for the cron, and
      # report what the account looks like afterwards. It fails the job only if the account is still not collecting when
      # the run is done — that is a revenue condition (tax is not being charged), never a broken-checkout one.
      # Without ADMIN_KEY it prints a notice and exits 0, which is honest now: the Worker cannot enable automatic_tax on
      # an account it has not measured, with or without this step.
      - name: Stripe Tax setup + report (the Worker self-sets; this is the immediate run)
        if: steps.creds.outputs.ready == 'true'
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          WORKER: https://mast-booking-backend.matthew-221.workers.dev
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "::notice::Stripe Tax: no ADMIN_KEY secret in this job, so this step asked the Worker for nothing — and nothing is pending on it. The Worker sets Stripe Tax up itself (the */5 trigger, the daily cron, and a refresh that runs BEHIND a checkout which finds the measurement due - never on the customer's path, and at most one per minute) and it never puts automatic_tax on a Checkout Session for an account it has not measured as collecting, so a deploy without this secret cannot produce a tax-broken checkout. The Smoke-test the MAST Worker workflow reports tax_ready and the tax:last_run heartbeat. Set a repository secret ADMIN_KEY (Settings -> Secrets and variables -> Actions -> Repository secrets) only to have the setup run here immediately instead of on the next cron."
            exit 0
          fi
          echo "::add-mask::$ADMIN_KEY"
          code=$(curl -sS -m 40 -o /tmp/tax.json -w '%{http_code}' -X POST -H "X-Admin-Key: $ADMIN_KEY" "$WORKER/admin/tax/setup" || echo ERR)
          echo "HTTP $code  POST /admin/tax/setup"
          # The Worker already redacts its own error bodies (taxRedact, src/worker.js). This is the second layer, for the
          # log: anything key-shaped is scrubbed on the way out rather than trusted not to be there.
          ADMIN_KEY="$ADMIN_KEY" python3 - /tmp/tax.json "$code" <<'PY'
          import json, os, re, sys
          raw = open(sys.argv[1], encoding='utf-8', errors='replace').read() if os.path.exists(sys.argv[1]) else ''
          scrub = lambda t: re.sub(r'(?i)Bearer\s+[A-Za-z0-9._~+/-]{8,}=*', 'Bearer [redacted]', re.sub(r'(sk_(?:live|test)_|rk_(?:live|test)_|pk_(?:live|test)_|whsec_|re_)[A-Za-z0-9_-]+', r'\1[redacted]', str(t).replace(os.environ.get('ADMIN_KEY') or '\0', '[redacted]')))
          if sys.argv[2] != '200':
              print(scrub(raw)[:2000])
              print('::error::Stripe Tax setup did not answer 200 (HTTP %s), so this job could not confirm the account is collecting. Checkout is NOT broken by this: the Worker only sends automatic_tax on an account it has measured as active, so sessions keep working untaxed. What is wrong is that Texas sales tax is not being charged - read the step above for which step Stripe refused.' % sys.argv[2])
              sys.exit(1)
          d = json.loads(raw)
          st = (d.get('settings') or {}); reg = d.get('registration') or {}; cache = d.get('tax_ready_cache') or {}; run = d.get('last_run')
          for n in d.get('notes') or []: print('   ' + scrub(str(n)))
          # The Worker scrubs these at the source now (taxSafe, src/worker.js). They are scrubbed here too because a
          # log layer that trusts its input is the layer that prints the one field the other one missed.
          print('   settings.status=%s head_office_set=%s' % (scrub(st.get('status')), st.get('head_office_set')))
          print('   registration id=%s status=%s type=%s collecting=%s created_now=%s' % (scrub(reg.get('id')), scrub(reg.get('status')), scrub(reg.get('type')), reg.get('collecting'), reg.get('created_now')))
          print('   tax_ready=%s (%s)' % (d.get('tax_ready'), scrub(d.get('tax_ready_reason'))))
          print('   readiness cache: measured_at=%s age=%ss TTL=%ss grace=%ss stale=%s' % (cache.get('measured_at'), cache.get('age_seconds'), cache.get('ttl_seconds'), cache.get('grace_seconds'), cache.get('stale')))
          # Two measurements, not one (round 9): last_run is the last measurement of ANY origin — including the run a
          # refused checkout enqueues — so it cannot answer "is the cron alive". cron_last_run is stamped by a cron
          # trigger and by nothing else, and loop_stale is the verdict on it. This step's own POST stamps the first and
          # never the second, which is exactly why they are printed apart.
          cron = d.get('cron_last_run')
          if run: print('   last measurement (any origin): %s  outcome=%s  age=%sh' % (run.get('at'), scrub(run.get('outcome')), run.get('age_hours')))
          else:   print('   last measurement (any origin): none recorded yet (this run is the first, or D1 is not bound)')
          if cron: print('   cron loop liveness: %s  trigger=%s  age=%sh  stale=%s' % (cron.get('at'), scrub(cron.get('trigger')), cron.get('age_hours'), d.get('loop_stale')))
          else:   print('   cron loop liveness: NEVER — no cron trigger has fired since the last D1 reset. Not a deploy failure; check the [triggers] block in wrangler.toml if it stays empty.')
          if d.get('tax_ready') is not True:
              print('::error::Stripe Tax is still NOT collecting after the setup run: tax_ready=%s (%s) — this is a REPORT, not a broken checkout. Checkout keeps working - the Worker will not put automatic_tax on a session for an account it has not measured as active - but Texas sales tax is NOT being charged on it. The notes above name the step that refused; a fresh account usually has to accept the Stripe Tax terms once, which is an account-holder action nothing here can do for you. A registration showing status=scheduled starts collecting on its active_from date and needs no action.' % (d.get('tax_ready'), scrub(d.get('tax_ready_reason'))))
              sys.exit(1)
          print('Stripe Tax is collecting: settings active, US/TX state_sales_tax active. Tax-enabled checkout is live on this deploy.')
          PY
